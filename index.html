<title>Найди ошибку модели</title>
<style>
@font-face { font-family: 'Manrope'; src: url('fonts/Manrope-Variable.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
@font-face { font-family: 'Source Code'; src: url('fonts/SourceCodeVF-Upright.woff2') format('woff2'); font-weight: 200 900; font-display: swap; }
:root {
  --blue: #076EA9; --teal: #0785A9; --orange: #E85D00; --green: #059669;
  --bg: #F5F7F9; --text: #1A2B3C; --muted: #5B6B7B; --line: #DCE3EA; --card: #FFFFFF;
  --mask: #3D4B59; --mark: #FDE7D6; --ok: #DCF3EA; --warn: #FFF0C2; --miss: #FCE4E4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 'Manrope', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
button { font: inherit; }
.top { background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 800; color: var(--blue); letter-spacing: .01em; }
.progress { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.dots { display: flex; gap: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dot.done { background: var(--teal); }
.dot.cur { background: var(--orange); }
main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 120px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.intro { max-width: 760px; margin: 6vh auto 0; }
.intro h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
.intro p { margin: 0 0 12px; }
.note { color: var(--muted); font-size: 14px; }
.intro .note { margin: 16px 0 0; }
.types-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; padding: 0; list-style: none; }
.types-legend li { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; background: var(--bg); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 9px; padding: 11px 20px; background: var(--blue); color: #fff; font-weight: 700; cursor: pointer; }
.btn:hover { background: #065d8f; }
.btn:disabled, .btn.orange:disabled { background: #A9BCCB; cursor: default; }
.btn.ghost { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
.btn.ghost:hover { background: #E7F1F8; }
.btn.orange { background: var(--orange); }
.btn.orange:hover { background: #c94f00; }
.task-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 14px; }
.task-head h2 { margin: 0; font-size: 22px; }
.task-head .instr { color: var(--muted); font-size: 15px; }
.grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.page-card { position: sticky; top: 12px; padding: 12px; }
.page-label { font-size: 14px; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.page-wrap { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: zoom-in; background: #fff; }
.page-wrap img { display: block; width: 100%; height: auto; }
.hl { position: absolute; border: 3px solid var(--orange); background: rgba(232, 93, 0, .13); border-radius: 4px; pointer-events: none; }
.label-s { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
.context { font-size: 15px; margin: 0 0 12px; }
details.req { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #F0F4F8; }
details.req summary { cursor: pointer; padding: 8px 12px; font-weight: 700; color: var(--blue); font-size: 15px; }
details.req pre { margin: 0; padding: 4px 12px 12px; white-space: pre-wrap; word-break: break-word; font: 13.5px/1.5 'Source Code', ui-monospace, Consolas, monospace; color: var(--text); }
.answer { font-size: 16px; }
.answer p { margin: 0 0 10px; }
.answer .h { font-weight: 800; margin: 12px 0 6px; }
.answer .gap { color: var(--muted); margin: 0 0 10px; }
.answer ul, .answer ol { margin: 0 0 10px; padding-left: 22px; }
.answer li { margin: 0 0 6px; }
.answer table { border-collapse: collapse; width: 100%; margin: 4px 0 10px; font-size: 15px; }
.answer th, .answer td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
.answer th { background: #F0F4F8; font-size: 13px; }
.answer table.stack, .answer table.stack tbody, .answer table.stack tr, .answer table.stack td { display: block; width: 100%; }
.answer table.stack thead { display: none; }
.answer table.stack tr { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; padding: 6px 4px; }
.answer table.stack td { border: 0; padding: 3px 8px; }
.answer table.stack td::before { content: attr(data-h); display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.ph { border-radius: 4px; padding: 1px 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; border-bottom: 1.5px dashed #9FB3C4; cursor: pointer; transition: background .12s; }
.ph:hover, .ph:focus-visible { background: #E3EEF6; outline: none; }
.ph.marked { background: var(--mark); border-bottom: 2px solid var(--orange); }
.ph.sel { background: #FFD4B3; }
.locked .ph { cursor: default; border-bottom-color: transparent; }
.locked .ph:hover { background: transparent; }
.ph.r-ok { background: var(--ok); border-bottom: 2px solid var(--green); }
.ph.r-type { background: var(--warn); border-bottom: 2px solid #B98900; }
.ph.r-miss { background: var(--miss); border-bottom: 2px solid #C0392B; }
.ph.r-false { background: #ECEFF3; border-bottom: 2px solid #8A99A8; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.3; padding: 1px 7px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; background: var(--orange); color: #fff; white-space: nowrap; }
.tag.t-ok { background: var(--green); }
.tag.t-type { background: #B98900; }
.tag.t-miss { background: #C0392B; }
.tag.t-false { background: #8A99A8; }
.mask { display: inline-block; width: 7.5em; height: .95em; background: var(--mask); border-radius: 2px; vertical-align: -2px; }
.actions { margin-top: 16px; }
.review { margin-top: 20px; }
.review h3 { margin: 0 0 4px; font-size: 20px; }
.review .sum { color: var(--muted); margin: 0 0 14px; }
.err { border-left: 4px solid var(--line); padding: 4px 0 4px 14px; margin: 0 0 16px; }
.err.v-ok { border-color: var(--green); }
.err.v-type { border-color: #B98900; }
.err.v-miss { border-color: #C0392B; }
.err.v-false { border-color: #8A99A8; }
.err .eh { font-weight: 800; }
.err .verdict { font-size: 14px; color: var(--muted); }
.err q { display: block; font-style: italic; color: #34495E; margin: 4px 0; quotes: '«' '»'; }
.method { background: #EAF4F8; border-radius: 10px; padding: 12px 16px; }
.method b { color: var(--teal); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(26, 43, 60, .12); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); z-index: 40; transform: translateY(105%); transition: transform .18s; }
.sheet.open { transform: none; }
.sheet-in { max-width: 860px; margin: 0 auto; }
.sheet .q { font-size: 14px; color: var(--muted); margin: 0 0 10px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sheet .types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.sheet .types button { border: 1.5px solid var(--blue); background: #fff; color: var(--blue); border-radius: 9px; padding: 10px 12px; font-weight: 700; cursor: pointer; text-align: left; }
.sheet .types button.on, .sheet .types button:hover { background: var(--blue); color: #fff; }
.sheet .row2 { display: flex; gap: 10px; justify-content: flex-end; }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 700; cursor: pointer; padding: 6px 4px; }
.zoom { position: fixed; inset: 0; background: rgba(20, 32, 44, .94); z-index: 60; overflow: auto; display: none; }
.zoom.open { display: block; }
.zoom-bar { position: sticky; top: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 10px 12px; z-index: 2; }
.zoom-bar button { border: 0; border-radius: 8px; padding: 8px 14px; background: #fff; color: var(--text); font-weight: 700; cursor: pointer; }
.zoom-in { position: relative; margin: 0 auto 24px; width: 100%; max-width: 1100px; background: #fff; }
.zoom-in img { display: block; width: 100%; height: auto; }
.final { max-width: 860px; margin: 4vh auto 0; }
.final h2 { font-size: 28px; margin: 0 0 8px; }
.score { font-size: 20px; margin: 0 0 6px; }
.final ul { padding-left: 20px; }
.final li { margin-bottom: 10px; }
.final .tline { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 8px 0; }
.final .tline .linkbtn { text-align: left; padding-left: 0; }
.final .tline span { white-space: nowrap; color: var(--muted); }
@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .page-card { position: static; }
  .intro h1 { font-size: 25px; }
  .card { padding: 14px; }
  .answer table, .answer thead, .answer tbody, .answer tr, .answer td { display: block; width: 100%; }
  .answer thead { display: none; }
  .answer tr { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; padding: 6px 4px; }
  .answer td { border: 0; padding: 3px 8px; }
  .answer td::before { content: attr(data-h); display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .progress .ptext { display: none; }
}

]}]], [[{"parts": ["Справка о зарегистрированных лицах"]}], [{"id": "l", "parts": ["в отчете нет"]}], [{"id": "m", "parts": ["Не приложена и не упоминается."]}]]]}], "phrases": {"a": "Из четырех документов в отчете три приложены, справки о зарегистрированных лицах нет.", "b": "49–51", "c": "Три листа.", "d": "Раздел 1 занимает листы 1 и 2 (с. 49 и 50), раздел 2 лист 3 (с. 51).", "e1": "Выписка от 10.01.2025 № КВИ-001/2025-5070234, кадастровый номер ▬▬▬.", "f": "52–54", "g": "Титул на с. 52, план и экспликация площади на с. 53, техническое описание на с. 54.", "h": "Паспорт составлен по состоянию на 17.06.2015, выдан 15.07.2015.", "i": "55–58", "j": "Договор от 28.11.2019.", "k": "На с. 58 отметки о регистрации права собственности и ипотеки в силу закона от 05.12.2019.", "l": "в отчете нет", "m": "Не приложена и не упоминается."}, "errors": [{"ph": "e1", "type": "num", "ok": ["num"], "text": "На с. 49 номер выписки напечатан как «КУВИ-001/2025-5070234», в ответе пропущена буква. Контрольная строка отработана верно, справка отмечена отсутствующей, но это не подтверждает остальные строки таблицы."}], "method": "Контрольная строка и сверка реквизитов по изображению", "methodText": "Позицией, которой в отчете заведомо нет, таблицу проверяют на строки, достроенные без опоры на текст. Номера и даты, прочитанные со сканов, после этого сверяют с изображением страницы знак в знак.", "hl": [[13.61, 34.56, 29.75, 2.38]]}, {"key": "t4", "img": "img/kv06.jpg", "iw": 1240, "ih": 1755, "label": "Отчет об оценке квартиры, с. 6", "context": "Отчет об оценке квартиры, раздел 2 «Задание на оценку». В запросе подан PDF отчета целиком.", "request": "Найди нарушения в разделе 2 «Задание на оценку» отчета Отчет.pdf.", "blocks": [{"t": "p", "items": [{"id": "a", "parts": ["Номера пунктов ФСО даны по памяти, тексты стандартов не открывались, перед включением в акт их нужно сверить."]}]}, {"t": "gap"}, {"t": "h", "text": "Допущения и ограничения классифицированы противоречиво (несущественное) се «найди нарушения» уже заложено, что нарушения есть, и в ответе появляются замечания к выполненным требованиям. В нейтральном запросе требуется указать, есть ли сведение и на какой странице. Номер пункта нормы сверяют с ее текстом до того, как замечание войдет в результат проверки.", "hl": [[41.86, 10.46, 51.48, 4.56], [14.41, 77.88, 78.88, 6.44]]}, {"key": "t5", "img": "img/kv29.jpg", "iw": 1240, "ih": 1755, "label": "Отчет об оценке квартиры, с. 29", "context": "Отчет об оценке квартиры, обоснование корректировки на торг. Сведения из отчета поданы в тексте запроса.", "request": "Сформулируй замечание эксперта саморегулируемой организации оценщиков к отчету об оценке рыночной стоимости квартиры в г. Ноябрьске. Факт. На с. 29 отчета в обосновании корректировки на торг написано: «Как следует из анализа рынка, в настоящее время скидки на торг находятся в пределах 1-15%». Ко всем четырем объектам-аналогам применена корректировка на торг −2 %. В разделе 9 «Анализ рынка» на с. 19—25 сведений о скидках на торг нет, источник величины 2 % в отчете не указан. Сошлись на требования законодательства об оценочной деятельности и федеральных стандартов оценки.", "blocks": [{"t": "p", "items": [{"parts": ["В ходе проверки установлено следующее."]}]}, {"t": "ol", "items": [[{"id": "a", "parts": ["Ссылка на анализ рынка не подтверждается материалами отчета."]}, {"parts": [" "]}, {"id": "b", "parts": ["В разделе 9 «Анализ рынка» (с. 19—25) сведения о скидках на торг отсутствуют."]}, {"parts": [" "]}, {"id": "c", "parts": ["Утверждение на с. 29 не опирается на данные, представленные в отчете."]}], [{"id": "d", "parts": ["Источник величины 2 % в отчете не указан."]}], [{"id": "e1", "parts": ["Примененная величина не согласуется с заявленным диапазоном."]}, {"parts": [" "]}, {"id": "f", "parts": ["Значение −2 % расположено у нижней границы диапазона 1–15 %, но оценщик не пояснил, почему выбрано именно оно, а не иное значение внутри диапазона."]}]]}, {"t": "h", "text": "Нарушенные требования"}, {"t": "ul", "items": [[{"id": "g", "parts": ["Статья 11 Федерального закона от 29.07.1998 № 135-ФЗ «Об оценочной деятельности в Российской Федерации»."]}, {"parts": [" "]}, {"id": "e3", "parts": ["Отчет должен содержать сведения доказательственного значения,"]}, {"parts": [" "]}, {"id": "h", "parts": ["не допускать неоднозначного толкования и не вводить в заблуждение, а также содержать перечень использованных данных с указанием источников их получения."]}], [{"id": "e2", "parts": ["Статья 14 того же закона."]}, {"parts": [" "]}, {"id": "i", "parts": ["Оценщик обязан соблюдать требования федеральных стандартов оценки."]}]]}], "phrases": {"a": "Ссылка на анализ рынка не подтверждается материалами отчета.", "b": "В разделе 9 «Анализ рынка» (с. 19—25) сведения о скидках на торг отсутствуют.", "c": "Утверждение на с. 29 не опирается на данные, представленные в отчете.", "d": "Источник величины 2 % в отчете не указан.", "e1": "Примененная величина не согласуется с заявленным диапазоном.", "f": "Значение −2 % расположено у нижней границы диапазона 1–15 %, но оценщик не пояснил, почему выбрано именно оно, а не иное значение внутри диапазона.", "g": "Статья 11 Федерального закона от 29.07.1998 № 135-ФЗ «Об оценочной деятельности в Российской Федерации».", "e3": "Отчет должен содержать сведения доказательственного значения,", "h": "не допускать неоднозначного толкования и не вводить в заблуждение, а также содержать перечень использованных данных с указанием источников их получения.", "e2": "Статья 14 того же закона.", "i": "Оценщик обязан соблюдать требования федеральных стандартов оценки."}, "errors": [{"ph": "e1", "type": "fake", "ok": ["fake"], "text": "Значение −2 % лежит внутри интервала 1—15 %, об этом сказано и в следующей фразе ответа. Противоречия с интервалом нет. Предметом замечания остается обоснованность величины, источник которой в отчете не указан."}, {"ph": "e2", "type": "num", "ok": ["num", "fake"], "text": "Обязанность оценщика соблюдать федеральны   var TASKS = DATA.tasks, TYPES = DATA.types, TYPE_KEYS = ['fake', 'page', 'skip', 'num'];

    var lab = el('p', 'page-label');
    lab.appendChild(el('span', null, t.label));
    lab.appendChild(el('span', null, 'увеличить нажатием'));
    pc.appendChild(lab);
    var pv = pageView(t, checked, false);
    pv.onclick = function () { openZoom(t, checked); };
    pc.appendChild(pv);
    grid.appendChild(pc);

    var ac = el('section', 'card');
    ac.appendChild(el('p', 'label-s', 'Условие'));
    ac.appendChild(el('p', 'context', t.context));
    if (t.request) {
      var d = el('details', 'req');
      if (t.request.length < 800) d.open = true;
      d.appendChild(el('summary', null, 'Запрос к модели'));
      d.appendChild(el('pre', null, t.request));
      ac.appendChild(d);
    }
    ac.appendChild(el('p', 'label-s', 'Ответ модели'));
    ac.appendChild(renderAnswer(t, checked));

    var act = el('div', 'btns actions');
    if (!checked) {
      var marks = state.marks[t.key] || {};
      var n = Object.keys(marks).length;
      var chk = el('button', 'btn orange', 'Проверить');
      chk.disabled = n === 0;
      chk.onclick = function () { state.checked[t.key] = true; save(); closeSheet(); render(); var r = document.getElementById('review'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      act.appendChild(chk);
      if (n) { var rs = el('button', 'btn ghost', 'Сбросить отметки'); rs.onclick = function () { state.marks[t.key] = {}; save(); render(); }; act.appendChild(rs); }
    } else {
      var nx = el('button', 'btn', idx + 1 < TASKS.length ? 'Следующее задание' : 'К итогу');
      nx.onclick = function () { go(idx + 1); };
      act.appendChild(nx);
    }
    if (idx > 0) { var pr = el('button', 'btn ghost', 'Предыдущее задание'); pr.onclick = function () { go(idx - 1); }; act.appendChild(pr); }
    ac.appendChild(act);
    grid.appendChild(ac);
    app.appendChild(grid);
    if (checked) app.appendChild(renderReview(t));
  }

  function renderReview(t) {
    var r = el('section', 'card review');
    r.id = 'review';
    var res = result(t), marks = state.marks[t.key] || {};
    r.appendChild(el('h3', null, 'Разбор'));
    var sum = 'Найдено ' + res.found + ' из ' + t.errors.length + ', вид указан верно в ' + res.typed + '.';
    if (res.falseMarks) sum += ' Отмечено фраз без ошибки ' + res.falseMarks + '.';
    r.appendChild(el('p', 'sum', sum));
    t.errors.forEach(function (e, i) {
      var mk = marks[e.ph], v = mk ? (e.ok.indexOf(mk) >= 0 ? 'ok' : 'type') : 'miss';
      var b = el('div', 'err v-' + v);
      b.appendChild(el('div', 'eh', 'Ошибка ' + (i + 1) + '. ' + TYPES[e.type]));
      var vt = v === 'ok' ? 'Найдена, вид указан верно.' : v === 'type' ? 'Найдена, указан вид «' + TYPES[mk] + '».' : 'Пропущена.';
      b.appendChild(el('div', 'verdict', vt));
      b.appendChild(el('q', null, t.phrases[e.ph]));
      b.appendChild(el('div', null, e.text));
      r.appendChild(b);
    });
    Object.keys(marks).forEach(function (k) {
      if (t.errors.some(function (e) { return e.ph === k; })) return;
      var b = el('div', 'err v-false');
      b.appendChild(el('div', 'eh', 'Фраза без ошибки'));
      b.appendChild(el('q', null, t.phrases[k]));
      b.appendChild(el('div', null, 'Сведение в этой фразе подтверждается отчетом или самим запросом.'));
      r.appendChild(b);
    });
    var m = el('div', 'method');
    var mh = el('div'); mh.appendChild(el('b', null, 'Прием проверки. ')); mh.appendChild(document.createTextNode(t.method + '.'));
    m.appendChild(mh);
    m.appendChild(el('div', null, t.methodText));
    r.appendChild(m);
    return r;
  }

  function renderFinal() {
    var c = el('section', 'card final');
    c.appendChild(el('h2', null, 'Итог'));
    var found = 0, typed = 0, falseMarks = 0;
    TASKS.forEach(function (t) { var r = result(t); found += r.found; typed += r.typed; falseMarks += r.falseMarks; });
    c.appendChild(el('p', 'score', 'Найдено ошибок ' + found + ' из ' + TOTAL + ', вид указан верно в ' + typed + '.'));
    if (falseMarks) c.appendChild(el('p', null, 'Отмечено фраз без ошибки ' + falseMarks + '.'));
    TASKS.forEach(function (t, i) {
      var r = result(t), line = el('div', 'tline');
      var a = el('button', 'linkbtn', 'Задание ' + (i + 1) + '. ' + t.label);
      a.onclick = function () { go(i); };
      line.appendChild(a);
      line.appendChild(el('span', null, state.checked[t.key] ? r.found + ' из ' + t.errors.length : 'не проверено'));
      c.appendChild(line);
    });
    var missed = [];
    TASKS.forEach(function (t, i) {
      if (!state.checked[t.key]) return;
      var marks = state.marks[t.key] || {};
      t.errors.forEach(function (e) { if (!marks[e.ph]) missed.push({ i: i, e: e, t: t }); });
    });
    if (missed.length) {
      c.appendChild(el('h3', null, 'Пропущенные ошибки'));
      var ul = el('ul');
      missed.forEach(function (m) {
        var li = el('li');
        li.appendChild(el('b', null, 'Задание ' + (m.i + 1) + ', ' + TYPES[m.e.type].toLowerCase() + '. '));
        li.appendChild(document.createTextNode('«' + m.t.phrases[m.e.ph] + '»'));
        ul.appendChild(li);
      });
      c.appendChild(ul);
    }
    var b = el('div', 'btns actions');
    var again = el('button', 'btn', 'Пройти заново');
    again.onclick = function () { state = fresh(); save(); go(0); };
    b.appendChild(again);
    c.appendChild(b);
    app.appendChild(c);
  }

  // выбор вида ошибки
  var sheet = document.getElementById('sheet'), sheetQ = document.getElementById('sheet-q'), sheetTypes = document.getElementById('sheet-types');
  var sheetTask = null;
  function openSheet(t, id) {
    sel = id; sheetTask = t;
    var cur = (state.marks[t.key] || {})[id];
    sheetQ.textContent = '«' + t.phrases[id] + '»';
    sheetTypes.innerHTML = '';
    TYPE_KEYS.forEach(function (k) {
      var b = el('button', cur === k ? 'on' : '', TYPES[k]);
      b.onclick = function () { (state.marks[t.key] = state.marks[t.key] || {})[id] = k; save(); closeSheet(); render(); };
      sheetTypes.appendChild(b);
    });
    document.getElementById('sheet-clear').style.display = cur ? '' : 'none';
    sheet.classList.add('open');
    render();
    var first = sheetTypes.querySelector('button'); if (first) first.focus({ preventScroll: true });
  }
  function closeSheet() { sel = null; sheet.classList.remove('open'); }
  document.getElementById('sheet-close').onclick = function () { closeSheet(); render(); };
  document.getElementById('sheet-clear').onclick = function () {
    if (sheetTask && sel) { delete (state.marks[sheetTask.key] || {})[sel]; save(); }
    closeSheet(); render();
  };

  // увеличение страницы
  var zoom = document.getElementById('zoom'), zin = document.getElementById('zoom-in'), zscale = 1;
  function openZoom(t, hl) {
    zin.innerHTML = ''; zin.appendChild(pageView(t, hl, true));
    zscale = 1; applyZoom();
    zoom.classList.add('open'); zoom.setAttribute('aria-hidden', 'false'); zoom.scrollTop = 0;
  }
  function applyZoom() {
    var base = window.innerWidth <= 860 ? 2.2 : 1;
    var big = base * zscale > 1;
    zin.style.width = big ? (base * zscale * 100) + '%' : '';
    zin.style.maxWidth = big ? 'none' : '';
  }
  document.getElementById('z-plus').onclick = function () { zscale = Math.min(zscale + 0.75, 3.25); applyZoom(); };
  document.getElementById('z-minus').onclick = function () { zscale = Math.max(zscale - 0.75, 1); applyZoom(); };
  document.getElementById('z-close').onclick = function () { zoom.classList.remove('open'); zoom.setAttribute('aria-hidden', 'true'); };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (zoom.classList.contains('open')) document.getElementById('z-close').onclick();
    else if (sheet.classList.contains('open')) { closeSheet(); render(); }
  });

  render();
})();
</script>
</body>
</html>
