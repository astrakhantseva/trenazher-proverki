:root {

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 'Manrope', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
button { font: inherit; }
.top { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.top-in { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 800; color: var(--blue); letter-spacing: .01em; background: none; border: 0; padding: 0; cursor: pointer; }
.progress { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.dots { display: flex; gap: 2px; }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.dot::before { content: attr(data-n); width: 20px; height: 20px; line-height: 20px; border-radius: 50%; background: var(--line); color: var(--text); text-align: center; }
.dot.done::before { background: var(--teal); color: #fff; }
.dot.cur::before { background: var(--orange); color: #fff; }
.dot:hover::before { outline: 2px solid var(--blue); }
.final-link { border: 1.5px solid var(--blue); background: #fff; color: var(--blue); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.final-link.cur { background: var(--orange); border-color: var(--orange); color: #fff; }
main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 120px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.intro { max-width: 760px; margin: 6vh auto 0; }
.intro h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
.intro p { margin: 0 0 12px; }
.note { color: var(--muted); font-size: 14px; }
.intro .note { margin: 16px 0 0; }
.types-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; padding: 0; list-style: none; }
.types-legend li { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; background: var(--bg); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 9px; padding: 11px 20px; background: var(--blue); color: #fff; font-weight: 700; cursor: pointer; }
.btn:hover { background: #065d8f; }
.btn:disabled, .btn.orange:disabled { background: #A9BCCB; cursor: default; }
.btn.ghost { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
.btn.ghost:hover { background: #E7F1F8; }
.btn.orange { background: var(--orange); }
.btn.orange:hover { background: #c94f00; }
.task-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 14px; }
.task-head h2 { margin: 0; font-size: 22px; }
.task-head .instr { color: var(--muted); font-size: 15px; }
.grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.page-card { position: sticky; top: 60px; padding: 12px; }
.page-card, .review { scroll-margin-top: 64px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.tab { position: relative; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 999px; padding: 3px 11px; font-size: 14px; cursor: pointer; }
.tab:hover { border-color: var(--blue); }
.tab.norm { border-style: dashed; }
.tab.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
.tab.has-hl::after { content: ''; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); border: 2px solid #fff; }
.page-label { font-size: 14px; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.page-wrap { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: zoom-in; background: #fff; }
.page-wrap img { display: block; width: 100%; height: auto; }
.hl { position: absolute; border: 3px solid var(--orange); background: rgba(232, 93, 0, .13); border-radius: 4px; pointer-events: none; }
.norm-view { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; max-height: calc(100vh - 190px); overflow: auto; font-size: 14.5px; line-height: 1.5; background: #FCFDFE; }
.norm-view p { margin: 0 0 8px; }
.norm-view mark { background: rgba(232, 93, 0, .16); box-shadow: 0 0 0 2px var(--orange); border-radius: 2px; color: inherit; }
.label-s { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
.context { font-size: 15px; margin: 0 0 12px; }
details.req { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #F0F4F8; }
details.req summary { cursor: pointer; padding: 8px 12px; font-weight: 700; color: var(--blue); font-size: 15px; }
details.req pre { margin: 0; padding: 4px 12px 12px; white-space: pre-wrap; word-break: break-word; font: 13.5px/1.5 'Source Code', ui-monospace, Consolas, monospace; color: var(--text); }
.hint { font-size: 14px; color: var(--muted); margin: -2px 0 8px; }
.answer { font-size: 16px; }
.answer p { margin: 0 0 10px; }
.answer .h { font-weight: 800; margin: 12px 0 6px; }
.answer .gap { color: var(--muted); margin: 0 0 10px; }
.answer ul, .answer ol { margin: 0 0 10px; padding-left: 22px; }
.answer li { margin: 0 0 6px; }
.answer table { border-collapse: collapse; width: 100%; margin: 4px 0 10px; font-size: 15px; }
.answer th, .answer td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
.answer th { background: #F0F4F8; font-size: 13px; }
.answer table.stack, .answer table.stack tbody, .answer table.stack tr, .answer table.stack td { display: block; width: 100%; }
.answer table.stack thead { display: none; }
.answer table.stack tr { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; padding: 6px 4px; }
.answer table.stack td { border: 0; padding: 3px 8px; }
.answer table.stack td::before { content: attr(data-h); display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.ph { border-radius: 4px; padding: 1px 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; border-bottom: 1.5px dashed #8FA6B9; cursor: pointer; transition: background .12s; }
.ph:hover, .ph:focus-visible { background: #E3EEF6; outline: none; }
.ph.marked { background: var(--mark); border-bottom: 2px solid var(--orange); }
.ph.sel { background: #FFD4B3; }
.locked .ph { cursor: default; border-bottom-color: transparent; }
.locked .ph:hover { background: transparent; }
.ph.r-ok { background: var(--ok); border-bottom: 2px solid var(--green); }
.ph.r-type { background: var(--warn); border-bottom: 2px solid #B98900; }
.ph.r-miss { background: var(--miss); border-bottom: 2px solid #C0392B; }
.ph.r-false { background: #ECEFF3; border-bottom: 2px solid #8A99A8; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.3; padding: 1px 7px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; background: var(--orange); color: #fff; white-space: nowrap; }
.tag.t-ok { background: var(--green); }
.tag.t-type { background: #B98900; }
.tag.t-miss { background: #C0392B; }
.tag.t-false { background: #8A99A8; }
.mask { display: inline-block; width: 7.5em; height: .95em; background: var(--mask); border-radius: 2px; vertical-align: -2px; }
.actions { margin-top: 16px; }
.review { margin-top: 20px; }
.review h3 { margin: 0 0 4px; font-size: 20px; }
.review .sum { color: var(--muted); margin: 0 0 14px; }
.err { border-left: 4px solid var(--line); padding: 4px 0 4px 14px; margin: 0 0 16px; }
.err.v-ok { border-color: var(--green); }
.err.v-type { border-color: #B98900; }
.err.v-miss { border-color: #C0392B; }
.err.v-false { border-color: #8A99A8; }
.err .eh { font-weight: 800; }
.err .verdict { font-size: 14px; color: var(--muted); }
.err q { display: block; font-style: italic; color: #34495E; margin: 4px 0; quotes: '«' '»'; }
.err .show { margin-top: 2px; padding-left: 0; }
.method { background: #EAF4F8; border-radius: 10px; padding: 12px 16px; }

.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 700; cursor: pointer; padding: 6px 4px; text-align: left; }

.zoom.open { display: block; }
.zoom-bar { position: sticky; top: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 10px 12px; z-index: 2; }

  .answer thead { display: none; }
  .answer tr { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; padding: 6px 4px; }
  .answer td { border: 0; padding: 3px 8px; }
  .answer td::before { content: attr(data-h); display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .top-in { gap: 8px; }
  .brand { font-size: 14px; }
  .progress .ptext { display: none; }
  .dot { width: 22px; height: 26px; }
  .dot::before { width: 18px; height: 18px; line-height: 18px; font-size: 11px; }
  .page-label { flex-direction: column; gap: 0; }
}
@media (max-width: 520px) {
  .brand { display: none; }
  .progress { margin-left: 0; width: 100%; justify-content: space-between; }
}
</style>

, "hl": []}, {"key": "kv06", "img": "img/kv06.jpg", "iw": 1240, "ih": 1755, "label": "Отчет об оценке квартиры, с. 6", "short": "с. 6", "hl": [[41.86, 10.46, 51.48, 4.56], [14.41, 77.88, 78.88, 6.44]]}], "norms": [{"key": "fso4", "title": "ФСО IV «Задание на оценку»", "short": "ФСО IV", "paras": ["1. Оценка объекта оценки выполняется оценщиком на основе задания на оценку, которое является неотъемлемой частью договора на оценку объекта оценки (далее – договор на оценку) или представлено в иной письменной форме в случае проведения оценки на основаниях, отличающихся от договора на оценку, предусмотренных Федеральным законом от 29 июля 1998 г. № 135-ФЗ «Об оценочной деятельности в Российской Федерации» (Собрание законодательства Российской Федерации, 1998, № 31, ст. 3813; 2021, № 27, ст. 5179) (далее – Федеральный закон).", "2. Задание на оценку согласовывается заказчиком оценки и оценщиком или юридическим лицом, с которым оценщик заключил трудовой договор, путем подписания в составе договора на оценку или в иной письменной форме в случае проведения оценки на основаниях, отличающихся от договора на оценку.", "Уточнение задания на оценку может продолжаться в течение процесса оценки до составления отчета об оценке.", "3. Задание на оценку должно содержать следующую информацию:", "1) объект оценки, включая права на объект оценки. Идентификация объекта оценки проводится на основе присущих ему количественных и качественных характеристик с учетом описания прав на объект оценки, учитываемых при определении стоимости, и связанных с ними ограничений и обременений. Требования к идентификации объекта оценки по отдельным видам объектов оценки устанавливаются соответствующими специальными федеральными стандартами оценки;", "2) цель оценки, которая должна быть установлена однозначно для определения предпосылок стоимости, в частности цель оценки должна сопровождаться указанием ссылок на конкретные положения нормативных правовых актов Российской Федерации, в связи с которыми возникла необходимость проведения оценки (если применимо);", "3) указание на то, что оценка проводится в соответствии с Федеральным законом;", "4) вид стоимости и предпосылки стоимости, если это необходимо в соответствии с пунктами 17 и 22 федерального стандарта оценки «Виды стоимости (ФСО II)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200;", "5) дата оценки;", "6) специальные допущения, иные существенные допущения в соответствии с разделом II федерального стандарта оценки «Процесс оценки (ФСО III)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200, если они известны на момент составления задания на оценку;", "7) ограничения оценки в соответствии с разделом III федерального стандарта оценки «Процесс оценки (ФСО III)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200, если они известны на момент составления задания на оценку;", "8) ограничения на использование, распространение и публикацию отчета об оценке объекта оценки (далее – отчет об оценке), за исключением случаев, установленных нормативными правовыми актами Российской Федерации;", "9) указание на форму составления отчета об оценке1;", "10) иная информация, предусмотренная федеральными стандартами оценки для отражения в задании на оценку.", "4. Задание на оценку может включать следующую информацию:", "1) состав и объем документов и материалов, представляемых заказчиком оценки;", "2) необходимость привлечения внешних организаций и квалифицированных отраслевых специалистов;", "3) сведения о предполагаемых пользователях результата оценки и отчета об оценке (помимо заказчика оценки);", "4) формы представления итоговой стоимости (например, в виде интервала значений, в валюте, в которой должна быть представлена стоимость в соответствии с пунктом 14 федерального стандарта оценки «Структура федеральных стандартов оценки и основные понятия, используемые в федеральных стандартах оценки (ФСО I)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200);", "5) специфические требования к отчету об оценке (например, в отношении формы и объема раскрытия в отчете информации), не противоречащие федеральному стандарту оценки «Отчет об оценке (ФСО VI)», утвержденному приказом Минэкономразвития России от 14 апреля 2022 г. № 200;", "6) указание на необходимость проведения дополнительных исследований и определения иных расчетных величин, которые не являются результатами оценки в соответствии с федеральными стандартами оценки."], "hl": ["Уточнение задания на оценку может продолжаться в течение процесса оценки до составления отчета об оценке.", "6) специальные допущения, иные существенные допущения в соответствии с разделом II федерального стандарта оценки «Процесс оценки (ФСО III)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200, если они известны на момент составления задания на оценку;"]}, {"key": "fso7_30", "title": "ФСО 7 «Оценка недвижимости», пункт 30", "short": "ФСО 7, п. 30", "paras": ["30. После проведения процедуры согласования оценщик, помимо указания в отчете об оценке итогового результата оценки стоимости недвижимости, приводит свое суждение о возможных границах интервала, в котором, по его мнению, может находиться эта стоимость, если в задании на оценку не указано иное."], "hl": ["если в задании на оценку не указано иное"]}], "start": "kv06", "context": "Отчет об оценке квартиры, раздел 2 «Задание на оценку» на с. 4—6. Модели подан PDF отчета целиком. Рядом со страницами приведен текст норм.", "request": "Найди нарушения в разделе 2 «Задание на оценку» отчета Отчет.pdf.", "blocks": [{"t": "p", "items": [{"parts": ["Номера пунктов ФСО даны по памяти, тексты стандартов не открывались, перед включением в акт их нужно сверить."]}]}, {"t": "gap"}, {"t": "h", "text": "Допущения и ограничения классифицированы противоречиво (несущественное)."}, {"t": "p", "items": [{"id": "b", "parts": ["В строках «Специальные допущения / иные существенные допущения» и «Ограничения оценки» стоят прочерки (стр. 4), а ниже приведены двенадцать допущений (стр. 5–6)."]}, {"parts": [" "]}, {"parts": ["…"]}, {"parts": [" "]}, {"id": "e1", "parts": ["Допущением 12 за оценщиком сохранено право добавлять допущения в отчете, тогда как ФСО IV п. 7 требует закрепить их в Задании."]}]}, {"t": "gap"}, {"t": "p", "items": [{"id": "c", "parts": ["Отказ от интервала стоимости соответствует строке Задания,"]}, {"parts": [" "]}, {"id": "e2", "parts": ["но в п. 4.5 норма ФСО 7 п. 30 пересказана как обязательная, формулировку нужно сверить."]}]}], "phrases": {"b": "В строках «Специальные допущения / иные существенные допущения» и «Ограничения оценки» стоят прочерки (стр. 4), а ниже приведены двенадцать допущений (стр. 5–6).", "e1": "Допущением 12 за оценщиком сохранено право добавлять допущения в отчете, тогда как ФСО IV п. 7 требует закрепить их в Задании.", "c": "Отказ от интервала стоимости соответствует строке Задания,", "e2": "но в п. 4.5 норма ФСО 7 п. 30 пересказана как обязательная, формулировку нужно сверить."}, "oks": {"b": "Верно. На с. 4 в этих строках прочерки, допущения 1—12 приведены на с. 5 и 6.", "c": "Верно. В последней строке задания на с. 4 сказано, что стоимость приводится без суждения о границах интервала."}, "errors": [{"ph": "e1", "type": "fake", "ok": ["fake", "num"], "text": "В ФСО IV четыре пункта, пункта 7 в стандарте нет. Согласно подпункту 6 пункта 3 в задании указывают допущения, «если они известны на момент составления задания на оценку», а согласно пункту 2 задание уточняется до составления отчета. Допущение 12 этим требованиям не противоречит, замечание мнимое.", "at": "fso4"}, {"ph": "e2", "type": "fake", "ok": ["fake"], "text": "Согласно пункту 30 ФСО 7 суждение о границах интервала приводится, «если в задании на оценку не указано иное». В п. 5 раздела 4 на с. 6 норма пересказана верно, отказ от интервала обоснован строкой задания.", "at": "fso7_30"}], "method": "Нейтральная постановка вопроса и сверка пункта с текстом стандарта", "methodText": "В запросе «найди нарушения» уже заложено, что нарушения есть, и в ответе появляются замечания к выполненным требованиям. В нейтральном запросе требуется указать, есть ли сведение и на какой странице. Номер пункта нормы проверяющий сверяет с ее текстом до включения замечания в результат проверки."}, {"key": "t5", "pages": [{"key": "kv29", "img": "img/kv29.jpg", "iw": 1240, "ih": 1755, "label": "Отчет об оценке квартиры, с. 29", "short": "с. 29", "hl": [[11.4, 71.45, 81.94, 3.35], [21.75, 82.71, 60.13, 1.78]]}], "norms": [{"key": "fz11", "title": "Закон № 135-ФЗ, статья 11", "short": "Закон, ст. 11", "paras": ["Статья 11. Общие требования к содержанию отчета об оценке объекта оценки", "Итоговым документом, составленным по результатам определения стоимости объекта оценки независимо от вида определенной стоимости, является отчет об оценке объекта оценки (далее также - отчет).", "Отчет составляется на бумажном носителе и (или) в форме электронного документа в соответствии с требованиями федеральных стандартов оценки, нормативных правовых актов уполномоченного федерального органа, осуществляющего функции по нормативно-правовому регулированию оценочной деятельности.", "Отчет не должен допускать неоднозначное толкование или вводить в заблуждение. В отчете в обязательном порядке указываются дата проведения оценки объекта оценки, используемые стандарты оценки, цели и задачи проведения оценки объекта оценки, а также иные сведения, необходимые для полного и недвусмысленного толкования результатов проведения оценки объекта оценки, отраженных в отчете.", "В отчете должны быть указаны: дата составления и порядковый номер отчета; основание для проведения оценщиком оценки объекта оценки; сведения об оценщике или оценщиках, проводивших оценку, в том числе фамилия, имя и (при наличии) отчество, номер контактного телефона, почтовый адрес, адрес электронной почты оценщика и сведения о членстве оценщика в саморегулируемой организации оценщиков; сведения о независимости юридического лица, с которым оценщик заключил трудовой договор, и оценщика в соответствии с требованиями статьи 16 настоящего Федерального закона; цель оценки; точное описание объекта оценки, а в отношении объекта оценки, принадлежащего юридическому лицу, - реквизиты юридического лица и при наличии балансовая стоимость данного объекта оценки; стандарты оценки для определения стоимости объекта оценки, перечень использованных при проведении оценки объекта оценки данных с указанием источников их получения, принятые при проведении оценки объекта оценки допущения; последовательность определения стоимости объекта оценки и ее итоговая величина, ограничения и пределы применения полученного результата; дата определения стоимости объекта оценки; перечень документов, используемых оценщиком и устанавливающих количественные и качественные характеристики объекта оценки.", "Отчет также может содержать иные сведения, являющиеся, по мнению оценщика, существенно важными для полноты отражения примененного им метода расчета стоимости конкретного объекта оценки.", "Для проведения оценки отдельных видов объектов оценки законодательством Российской Федерации могут быть предусмотрены специальные формы отчетов.", "Отчет должен быть пронумерован постранично, прошит (за исключением случаев составления отчета в форме электронного документа), подписан оценщиком или оценщиками, которые провели оценку, а также скреплен личной печатью оценщика или оценщиков либо печатью юридического лица, с которым оценщик или оценщики заключили трудовой договор.", "Отчет, составленный в форме электронного документа, должен быть подписан усиленной квалифицированной электронной подписью в соответствии с законодательством Российской Федерации.", "В случаях, предусмотренных настоящим Федеральным законом, нормативными правовыми актами уполномоченного федерального органа, осуществляющего функции по нормативно-правовому регулированию оценочной деятельности, отчет подлежит опубликованию в порядке, установленном уполномоченным федеральным органом, осуществляющим функции по нормативно-правовому регулированию оценочной деятельности."], "hl": ["Отчет не должен допускать неоднозначное толкование или вводить в заблуждение.", "перечень использованных при проведении оценки объекта оценки данных с указанием источников их получения"]}, {"key": "fz15", "title": "Закон № 135-ФЗ, статья 15 (начало)", "short": "Закон, ст. 15", "paras": ["Статья 15. Обязанности оценщика", "Оценщик обязан: быть членом одной из саморегулируемых организаций оценщиков; соблюдать требования настоящего Федерального закона, федеральных стандартов оценки, иных нормативных правовых актов Российской Федерации в области оценочной деятельности, а также требования стандартов и правил оценочной деятельности, утвержденных саморегулируемой организацией оценщиков, членом которой он является; …"], "hl": ["соблюдать требования настоящего Федерального закона, федеральных стандартов оценки"]}], "start": "kv29", "context": "Отчет об оценке квартиры, обоснование корректировки на торг. Файл отчета модели не подан, сведения из отчета приведены в запросе. Рядом со страницей приведен текст норм.", "request": "Сформулируй замечание эксперта саморегулируемой организации оценщиков к отчету об оценке рыночной стоимости квартиры в г. Ноябрьске. Факт. На с. 29 отчета в обосновании корректировки на торг написано: «Как следует из анализа рынка, в настоящее время скидки на торг находятся в пределах 1-15%». Ко всем четырем объектам-аналогам применена корректировка на торг −2 %. В разделе 9 «Анализ рынка» на с. 19—25 сведений о скидках на торг нет, источник величины 2 % в отчете не указан. Сошлись на требования законодательства об оценочной деятельности и федеральных стандартов оценки.", "blocks": [{"t": "p", "items": [{"parts": ["В ходе проверки установлено следующее."]}]}, {"t": "ol", "items": [[{"id": "a", "parts": ["Ссылка на анализ рынка не подтверждается материалами отчета."]}, {"parts": [" "]}, {"id": "b", "parts": ["В разделе 9 «Анализ рынка» (с. 19—25) сведения о скидках на торг отсутствуют."]}, {"parts": [" "]}, {"id": "c", "parts": ["Утверждение на с. 29 не опирается на данные, представленные в отчете."]}], [{"id": "d", "parts": ["Источник величины 2 % в отчете не указан."]}], [{"id": "e1", "parts": ["Примененная величина не согласуется с заявленным диапазоном."]}, {"parts": [" "]}, {"id": "f", "parts": ["Значение −2 % расположено у нижней границы диапазона 1–15 %, но оценщик не пояснил, почему выбрано именно оно, а не иное значение внутри диапазона."]}]]}, {"t": "h", "text": "Нарушенные требования"}, {"t": "ul", "items": [[{"id": "g", "parts": ["Статья 11 Федерального закона от 29.07.1998 № 135-ФЗ «Об оценочной деятельности в Российской Федерации»."]}, {"parts": [" "]}, {"id": "e3", "parts": ["Отчет должен содержать сведения доказательственного значения,"]}, {"parts": [" "]}, {"id": "h", "parts": ["не допускать неоднозначного толкования и не вводить в заблуждение, а также содержать перечень использованных данных с указанием источников их получения."]}], [{"id": "e2", "parts": ["Статья 14 того же закона."]}, {"parts": [" "]}, {"id": "i", "parts": ["Оценщик обязан соблюдать требования федеральных стандартов оценки."]}]]}], "phrases": {"a": "Ссылка на анализ рынка не подтверждается материалами отчета.", "b": "В разделе 9 «Анализ рынка» (с. 19—25) сведения о скидках на торг отсутствуют.", "c": "Утверждение на с. 29 не опирается на данные, представленные в отчете.", "d": "Источник величины 2 % в отчете не указан.", "e1": "Примененная величина не согласуется с заявленным диапазоном.", "f": "Значение −2 % расположено у нижней границы диапазона 1–15 %, но оценщик не пояснил, почему выбрано именно оно, а не иное значение внутри диапазона.", "g": "Статья 11 Федерального закона от 29.07.1998 № 135-ФЗ «Об оценочной деятельности в Российской Федерации».", "e3": "Отчет должен содержать сведения доказательственного значения,", "h": "не допускать неоднозначного толкования и не вводить в заблуждение, а также содержать перечень использованных данных с указанием источников их получения.", "e2": "Статья 14 того же закона.", "i": "Оценщик обязан соблюдать требования федеральных стандартов оценки."}, "oks": {"a": "Верно, по сведениям запроса в разделе 9 данных о скидках на торг нет.", "b": "Верно, это сказано в запросе.", "c": "Верно, это следует из сведений запроса.", "d": "Верно, это сказано в запросе.", "f": "Верно. Значение −2 % на с. 29 входит в интервал 1—15 % и близко к его нижней границе, выбор значения в отчете не объяснен.", "g": "Верно, статья 11 закона устанавливает требования к содержанию отчета.", "h": "Верно, оба требования есть в статье 11.", "i": "Верно по содержанию, эта обязанность записана в статье 15."}, "errors": [{"ph": "e1", "type": "fake", "ok": ["fake"], "text": "Значение −2 % входит в интервал 1—15 %, об этом сказано и в следующей фразе ответа. Противоречия с интервалом нет. Предметом замечания остается обоснованность величины, источник которой в отчете не указан.", "at": "kv29"}, {"ph": "e2", "type": "num", "ok": ["num", "fake"], "text": "Обязанность оценщика соблюдать федеральные стандарты оценки установлена статьей 15 Федерального закона № 135-ФЗ. Статья 14 устанавливает права оценщика.", "at": "fz15"}, {"ph": "e3", "type": "fake", "ok": ["fake"], "text": "В действующей редакции статьи 11 слов о сведениях доказательственного значения нет. Требования о недопустимости неоднозначного толкования и о перечне использованных данных с указанием источников в статье есть.", "at": "fz11"}], "method": "Сверка доводов с числами страницы и ссылок с текстом нормы", "methodText": "Проверяющий сопоставляет каждый довод замечания с числами на странице отчета, а статьи закона и пункты стандартов сверяет с их текстом. Ссылку, которой нет в тексте нормы, в замечание не включают."}, {"key": "t6", "pages": [{"key": "zu05", "img": "img/zu05.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 5", "short": "с. 5", "hl": [[44.46, 91.39, 16.53, 2.02]]}, {"key": "zu09", "img": "img/zu09.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 9", "short": "с. 9", "hl": []}, {"key": "zu19", "img": "img/zu19.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 19", "short": "с. 19", "hl": [[27.01, 18.25, 17.63, 2.16]]}, {"key": "zu122", "img": "img/zu122.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 122", "short": "с. 122", "hl": [[13.1, 75.07, 72.73, 5.23]]}], "norms": [], "start": "zu122", "context": "Отчет об оценке земельных участков. Ответ получен при повторной проверке строки свода нарушений по самому отчету и его приложениям. Страница 122 входит в ту же выписку по участку объекта 3, что и страница 126.", "request": null, "blocks": [{"t": "p", "items": [{"parts": ["Выписки по участкам объектов 2 (с. 111) и 3 (с. 126) и договор купли-продажи участка объекта 3 (с. 117) содержат ограничения прав по ст. 56 Земельного кодекса,"]}, {"parts": [" "]}, {"id": "e1", "parts": ["что расходится с текстом «ограничения и обременения права не зарегистрированы» (с. 19) и «Не зарегистрировано.» (с. 5)."]}]}, {"t": "gap"}, {"t": "p", "items": [{"id": "b", "parts": ["Расчет без учета ограничений предусмотрен заданием (с. 9)"]}, {"parts": [" …"]}]}], "phrases": {"e1": "что расходится с текстом «ограничения и обременения права не зарегистрированы» (с. 19) и «Не зарегистрировано.» (с. 5).", "b": "Расчет без учета ограничений предусмотрен заданием (с. 9)"}, "oks": {"b": "Верно. На с. 9 права, учитываемые при оценке, указаны «без учета ограничений и обременений»."}, "errors": [{"ph": "e1", "type": "skip", "ok": ["skip"], "text": "В выписке ограничения, предусмотренные статьями 56 и 56.1 Земельного кодекса, записаны в особых отметках как сведения об ограничениях, «не зарегистрированных в реестре прав». Фраза отчета о том, что ограничения и обременения не зарегистрированы, с выпиской согласуется. Раздел особых отметок в ответе не учтен, противоречия нет.", "at": "zu122"}], "method": "Просмотр документа целиком и повторная проверка без истории", "methodText": "Проверяющий сверяет цитату из выписки со всеми ее разделами, включая особые отметки. Спорную строку свода перепроверяют в отдельном диалоге без истории и без предыдущих выводов, а при расхождении двух проверок обращаются к самому документу."}, {"key": "t7", "pages": [{"key": "zu07", "img": "img/zu07.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 7", "short": "с. 7", "hl": [[25.56, 31.29, 48.96, 3.39]]}, {"key": "zu91", "img": "img/zu91.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 91", "short": "с. 91", "hl": [[17.06, 34.58, 57.45, 3.39], [75.81, 33.22, 16.17, 2.02]]}], "norms": [], "start": "zu91", "context": "Отчет об оценке земельных участков и права пользования зданием. Ответ получен при составлении свода нарушений по отчету.", "request": null, "blocks": [{"t": "p", "items": [{"parts": ["Объект 4 определен «с учетом относимого земельного участка с кадастровым номером ", null, "» (с. 1, 5, 8),"]}, {"parts": [" "]}, {"id": "b", "parts": ["этот же участок оценен отдельно как объект 3, «62 319 000 руб.» (с. 7, 91)."]}, {"parts": [" …"]}]}, {"t": "p", "items": [{"id": "e1", "parts": ["Входит ли плата за участок в результат по объекту 4 «1 345 878 руб./месяц» (с. 91), в отчете не сказано,"]}, {"parts": [" …"]}]}, {"t": "p", "items": [{"id": "c", "parts": ["В итоговой таблице участок одновременно оценен отдельно и включен в объект 4 (с. 91)."]}]}], "phrases": {"b": "этот же участок оценен отдельно как объект 3, «62 319 000 руб.» (с. 7, 91).", "e1": "Входит ли плата за участок в результат по объекту 4 «1 345 878 руб./месяц» (с. 91), в отчете не сказано,", "c": "В итоговой таблице участок одновременно оценен отдельно и включен в объект 4 (с. 91)."}, "oks": {"b": "Верно, объект 3 оценен в 62 319 000 руб. в таблицах на с. 7 и 91.", "c": "Верно, на с. 91 участок оценен отдельно как объект 3 и назван в составе объе       var d = el('details', 'req');
      if (t.request.length < 800) d.open = true;
      d.appendChild(el('summary', null, 'Запрос к модели'));
      d.appendChild(el('pre', null, t.request));
      ac.appendChild(d);
    }
    ac.appendChild(el('p', 'label-s', 'Ответ модели'));
    if (!checked) ac.appendChild(el('p', 'hint', 'Отметить можно фразы, подчеркнутые пунктиром.'));
    ac.appendChild(renderAnswer(t, checked));

    var act = el('div', 'btns actions');
    if (idx > 0) { var pr = el('button', 'btn ghost', 'Предыдущее задание'); pr.onclick = function () { go(idx - 1); }; act.appendChild(pr); }
    if (!checked) {
      var marks = marksOf(t);
      var n = Object.keys(marks).length;
      var chk = el('button', 'btn orange', 'Проверить');
      chk.disabled = n === 0;
      chk.onclick = function () {
        state.checked[t.key] = true; save(); closeSheet(); tabSel[t.key] = t.start; render();
        var r = document.getElementById('review'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      act.appendChild(chk);
      if (n) { var rs = el('button', 'btn ghost', 'Сбросить отметки'); rs.onclick = function () { state.marks[t.key] = {}; save(); render(); }; act.appendChild(rs); }
    } else {
      if (idx + 1 < TASKS.length) { var nx = el('button', 'btn', 'Следующее задание'); nx.onclick = function () { go(idx + 1); }; act.appendChild(nx); }
      if (idx + 1 >= TASKS.length || allChecked()) { var fi = el('button', idx + 1 < TASKS.length ? 'btn ghost' : 'btn', 'К итогу'); fi.onclick = function () { go(TASKS.length); }; act.appendChild(fi); }
    }
    ac.appendChild(act);
    grid.appendChild(ac);
    app.appendChild(grid);
    if (checked) app.appendChild(renderReview(t, pc));
  }

  function showAt(t, pc, key) {
    tabSel[t.key] = key;
    renderPagePanel(pc, t, true);
    pc.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderReview(t, pc) {
    var r = el('section', 'card review');
    r.id = 'review';
    var res = result(t), marks = marksOf(t);
    r.appendChild(el('h3', null, 'Разбор'));
    var sum = 'Найдено ' + res.found + ' из ' + t.errors.length + ', вид указан верно в ' + res.typed + '.';
    if (res.falseMarks) sum += ' Отмечено фраз без ошибки ' + res.falseMarks + '.';
    r.appendChild(el('p', 'sum', sum));
    var labels = {};
    t.pages.forEach(function (p) { labels[p.key] = 'Показать на ' + p.short; });
    t.norms.forEach(function (n) { labels[n.key] = 'Показать в тексте нормы'; });
    t.errors.forEach(function (e, i) {
      var mk = marks[e.ph], v = mk ? (e.ok.indexOf(mk) >= 0 ? 'ok' : 'type') : 'miss';
      var b = el('div', 'err v-' + v);
      b.appendChild(el('div', 'eh', 'Ошибка ' + (i + 1) + '. ' + TYPES[e.type]));
      var vt = v === 'ok' ? 'Найдена, вид указан верно.' : v === 'type' ? 'Найдена, указан вид «' + TYPES[mk] + '».' : 'Пропущена.';
      b.appendChild(el('div', 'verdict', vt));
      b.appendChild(el('q', null, t.phrases[e.ph]));
      b.appendChild(el('div', null, e.text));
      if (e.at && labels[e.at]) {
        var sb = el('button', 'linkbtn show', labels[e.at]);
        sb.onclick = function () { showAt(t, pc, e.at); };
        b.appendChild(sb);
      }
      r.appendChild(b);
    });
    Object.keys(marks).forEach(function (k) {
      if (t.errors.some(function (e) { return e.ph === k; })) return;
      var b = el('div', 'err v-false');
      b.appendChild(el('div', 'eh', 'Фраза без ошибки'));
      b.appendChild(el('q', null, t.phrases[k]));
      b.appendChild(el('div', null, t.oks[k] || 'Сведение в этой фразе подтверждается отчетом или запросом.'));
      r.appendChild(b);
    });
    var m = el('div', 'method');
    var mh = el('div'); mh.appendChild(el('b', null, 'Прием проверки. ')); mh.appendChild(document.createTextNode(t.method + '.'));
    m.appendChild(mh);
    m.appendChild(el('div', null, t.methodText));
    r.appendChild(m);
    return r;
  }

  function renderFinal() {
    var c = el('section', 'card final');
    c.appendChild(el('h2', null, 'Итог'));
    var found = 0, typed = 0, falseMarks = 0, done = 0;
    TASKS.forEach(function (t) { if (!state.checked[t.key]) return; done++; var r = result(t); found += r.found; typed += r.typed; falseMarks += r.falseMarks; });
    var total = TASKS.reduce(function (s, t) { return s + (state.checked[t.key] ? t.errors.length : 0); }, 0);
    if (done < TASKS.length) c.appendChild(el('p', null, 'Проверено заданий ' + done + ' из ' + TASKS.length + '.'));
    c.appendChild(el('p', 'score', 'Найдено ошибок ' + found + ' из ' + (done < TASKS.length ? total : TOTAL) + ', вид указан верно в ' + typed + '.'));
    if (falseMarks) c.appendChild(el('p', null, 'Отмечено фраз без ошибки ' + falseMarks + '.'));
    TASKS.forEach(function (t, i) {
      var r = result(t), line = el('div', 'tline');
      var a = el('button', 'linkbtn', 'Задание ' + (i + 1) + '. ' + startPage(t).label);
      a.onclick = function () { go(i); };
      line.appendChild(a);
      line.appendChild(el('span', null, state.checked[t.key] ? r.found + ' из ' + t.errors.length : 'не проверено'));
      c.appendChild(line);
    });
    var missed = [];
    TASKS.forEach(function (t, i) {
      if (!state.checked[t.key]) return;
      var marks = marksOf(t);
      t.errors.forEach(function (e) { if (!marks[e.ph]) missed.push({ i: i, e: e, t: t }); });
    });
    if (missed.length) {
      c.appendChild(el('h3', null, 'Пропущенные ошибки'));
      var ul = el('ul');
      missed.forEach(function (m) {
        var li = el('li');
        var a = el('button', 'linkbtn', 'Задание ' + (m.i + 1) + ', ' + TYPES[m.e.type].toLowerCase() + '.');
        a.onclick = function () { go(m.i); };
        li.appendChild(a);
        li.appendChild(document.createTextNode(' «' + m.t.phrases[m.e.ph] + '»'));
        ul.appendChild(li);
      });
      c.appendChild(ul);
    }
    var b = el('div', 'btns actions');
    var again = el('button', 'btn', 'Пройти заново');
    again.onclick = function () { state = fresh(); tabSel = {}; save(); go(0); };
    b.appendChild(again);
    c.appendChild(b);
    app.appendChild(c);
  }

  // выбор вида ошибки
  var sheet = document.getElementById('sheet'), sheetQ = document.getElementById('sheet-q'), sheetTypes = document.getElementById('sheet-types');
  var sheetTask = null;
  function openSheet(t, id) {
    sel = id; sheetTask = t;
    var cur = marksOf(t)[id];
    sheetQ.textContent = '«' + t.phrases[id] + '»';
    sheetTypes.innerHTML = '';
    TYPE_KEYS.forEach(function (k) {
      var b = el('button', cur === k ? 'on' : '', TYPES[k]);
      b.onclick = function () { (state.marks[t.key] = state.marks[t.key] || {})[id] = k; save(); closeSheet(); render(); };
      sheetTypes.appendChild(b);
    });
    document.getElementById('sheet-clear').style.display = cur ? '' : 'none';
    sheet.classList.add('open');
    render();
    var first = sheetTypes.querySelector('button'); if (first) first.focus({ preventScroll: true });
  }
  function closeSheet() { sel = null; sheet.classList.remove('open'); }
  document.getElementById('sheet-close').onclick = function () { closeSheet(); render(); };
  document.getElementById('sheet-clear').onclick = function () {
    if (sheetTask && sel) { delete (state.marks[sheetTask.key] || {})[sel]; save(); }
    closeSheet(); render();
  };

  // увеличение страницы
  var zoom = document.getElementById('zoom'), zin = document.getElementById('zoom-in'), zscale = 1;
  function openZoom(p, hl) {
    zin.innerHTML = ''; zin.appendChild(pageView(p, hl, true));
    zscale = 1; applyZoom();
    zoom.classList.add('open'); zoom.setAttribute('aria-hidden', 'false'); zoom.scrollTop = 0;
  }
  function applyZoom() {
    var base = window.innerWidth <= 860 ? 2.2 : 1;
    var big = base * zscale > 1;
    zin.style.width = big ? (base * zscale * 100) + '%' : '';
    zin.style.maxWidth = big ? 'none' : '';
  }
  document.getElementById('z-plus').onclick = function () { zscale = Math.min(zscale + 0.75, 3.25); applyZoom(); };
  document.getElementById('z-minus').onclick = function () { zscale = Math.max(zscale - 0.75, 1); applyZoom(); };
  document.getElementById('z-close').onclick = function () { zoom.classList.remove('open'); zoom.setAttribute('aria-hidden', 'true'); };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (zoom.classList.contains('open')) document.getElementById('z-close').onclick();
    else if (sheet.classList.contains('open')) { closeSheet(); render(); }
  });

  render();
})();
</script>
</body>
</html>
