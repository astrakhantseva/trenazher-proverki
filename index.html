<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
<title>Найди ошибку модели</title>
<style>
@font-face { font-family: 'Manrope'; src: url('fonts/Manrope-Variable.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
@font-face { font-family: 'Source Code'; src: url('fonts/SourceCodeVF-Upright.woff2') format('woff2'); font-weight: 200 900; font-display: swap; }
:root {
  --navy: #092F4B; --navy2: #0B3C5E; --blue: #076EA9; --teal: #0785A9; --orange: #E85D00; --green: #059669;
  --bg: #F7F6F2; --strip: #ECF2F6; --ink: #1A2B3C; --muted: #5B6E7E; --card: #FFFFFF;
  --line: rgba(26, 43, 60, .12); --line-strong: rgba(26, 43, 60, .22);
  --band-accent: #9CCDE9; --band-muted: #B9D3E4; --band-line: rgba(255, 255, 255, .28);
  --mask: #3D4B59; --mark: #FDE7D6; --ok: #DCF3EA; --warn: #FFF0C2; --miss: #FCE4E4; --amber: #B98900; --red: #C0392B;
  --shadow: 0 1px 2px rgba(26, 43, 60, .05), 0 8px 24px rgba(26, 43, 60, .06);
  --t-fake: #E85D00; --t-page: #076EA9; --t-skip: #0785A9; --t-num: #059669;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 'Manrope', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
button { font: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
.kicker { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin: 0 0 10px; }

/* шапка */
.top { background: rgba(255, 255, 255, .96); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; backdrop-filter: saturate(1.2) blur(6px); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 9px 16px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--navy); background: none; border: 0; padding: 0; cursor: pointer; font-size: 15px; letter-spacing: .01em; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%); display: flex; align-items: center; justify-content: center; flex: none; }
.progress { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.dots { position: relative; display: flex; gap: 6px; }
.dots::before { content: ''; position: absolute; left: 12px; right: 12px; top: 50%; height: 2px; background: var(--line); transform: translateY(-50%); }
.dot { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-strong); background: #fff; cursor: pointer; padding: 0; font-size: 12px; font-weight: 800; color: var(--muted); line-height: 22px; text-align: center; }
.dot.done { background: var(--teal); border-color: var(--teal); color: #fff; }
.dot.cur { background: var(--orange); border-color: var(--orange); color: #fff; box-shadow: 0 0 0 3px rgba(232, 93, 0, .18); }
.dot:hover { border-color: var(--blue); }
.final-link { border: 1.5px solid var(--blue); background: #fff; color: var(--blue); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 800; cursor: pointer; }
.final-link:hover { background: #E7F1F8; }
.final-link.cur { background: var(--orange); border-color: var(--orange); color: #fff; }
main { padding: 0 0 120px; }

/* синяя полоса */
.hero { background: linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%); color: #F2F7FA; padding: 56px 0 44px; position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; right: -120px; top: -120px; width: 420px; height: 420px; border-radius: 50%; border: 1px solid rgba(156, 205, 233, .18); box-shadow: 0 0 0 60px rgba(156, 205, 233, .04), 0 0 0 140px rgba(156, 205, 233, .03); pointer-events: none; }
.hero .kicker { color: var(--band-accent); }
.hero h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.08; letter-spacing: -.015em; margin: 0 0 16px; font-weight: 800; }
.hero .lead { font-size: 17px; color: var(--band-muted); max-width: 760px; margin: 0 0 26px; }
.hero .lead b { color: #F2F7FA; font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 40px; max-width: 920px; }
.tile { border-top: 1px solid var(--band-line); padding-top: 16px; }
.tile b { display: block; font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
.tile span { display: block; font-size: 15px; color: var(--band-muted); line-height: 1.45; }

/* кнопки */
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 10px; padding: 12px 22px; background: var(--blue); color: #fff; font-weight: 800; cursor: pointer; transition: background .12s, box-shadow .12s; }
.btn:hover { background: #065d8f; }
.btn:disabled, .btn.orange:disabled { background: #A9BCCB; cursor: default; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
.btn.ghost:hover { background: #E7F1F8; }
.btn.orange { background: var(--orange); box-shadow: 0 4px 14px rgba(232, 93, 0, .25); }
.btn.orange:hover { background: #c94f00; }
.btn.white { background: #fff; color: var(--navy); }
.btn.white:hover { background: #E7F1F8; }
.btn.outline-white { background: transparent; color: #fff; border: 1.5px solid rgba(255, 255, 255, .55); }
.btn.outline-white:hover { background: rgba(255, 255, 255, .08); }

/* вводный экран */
.blocks { padding-top: 36px; display: grid; gap: 34px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; box-shadow: var(--shadow); }
.step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--strip); color: var(--blue); font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.step b { display: block; margin-bottom: 4px; }
.step p { margin: 0; color: var(--muted); font-size: 15px; }
.types-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.type-card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--blue)); border-radius: 12px; padding: 14px 16px; }
.type-card b { display: block; }
.type-card span { color: var(--muted); font-size: 15px; }
.t-fake { --c: var(--t-fake); } .t-page { --c: var(--t-page); } .t-skip { --c: var(--t-skip); } .t-num { --c: var(--t-num); }
.note { color: var(--muted); font-size: 14px; margin: 0; }

/* задание */
.task-head { padding: 26px 0 16px; }
.task-head h2 { margin: 0; font-size: clamp(24px, 3vw, 30px); letter-spacing: -.01em; }
.task-head .instr { color: var(--muted); font-size: 15px; margin: 6px 0 0; }
.grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
.page-card { position: sticky; top: 62px; padding: 12px; }
.page-card, .review { scroll-margin-top: 66px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
.tab { position: relative; border: 1px solid var(--line-strong); background: #fff; color: var(--ink); border-radius: 999px; padding: 3px 11px; font-size: 14px; cursor: pointer; }
.tab:hover { border-color: var(--blue); }
.tab.norm { border-style: dashed; }
.tab.on { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 700; }
.tab.has-hl::after { content: ''; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); border: 2px solid #fff; }
.page-label { font-size: 14px; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.page-label .zoom-hint { color: var(--blue); font-weight: 700; }
.page-wrap { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; background: #fff; }
.page-wrap img { display: block; width: 100%; height: auto; }
.hl { position: absolute; border: 3px solid var(--orange); background: rgba(232, 93, 0, .13); border-radius: 4px; pointer-events: none; }
.norm-view { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; max-height: calc(100vh - 200px); overflow: auto; font-size: 14.5px; line-height: 1.55; background: #FCFCFA; }
.norm-view p { margin: 0 0 8px; }
.norm-view mark { background: rgba(232, 93, 0, .16); box-shadow: 0 0 0 2px var(--orange); border-radius: 2px; color: inherit; }
.label-s { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 800; margin: 0 0 6px; }
.context { font-size: 15px; margin: 0 0 14px; background: var(--strip); border-radius: 10px; padding: 10px 12px; }
details.req { margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; background: #FBFBF9; }
details.req summary { cursor: pointer; padding: 9px 12px; font-weight: 800; color: var(--blue); font-size: 15px; }
details.req pre { margin: 0; padding: 2px 12px 12px; white-space: pre-wrap; word-break: break-word; font: 13.5px/1.5 'Source Code', ui-monospace, Consolas, monospace; color: var(--ink); }
.hint { font-size: 14px; color: var(--muted); margin: -2px 0 8px; }
.answer { font-size: 16px; }
.answer p { margin: 0 0 10px; }
.answer .h { font-weight: 800; margin: 12px 0 6px; }
.answer .gap { color: var(--muted); margin: 0 0 10px; }
.answer ul, .answer ol { margin: 0 0 10px; padding-left: 22px; }
.answer li { margin: 0 0 6px; }
.answer table { border-collapse: collapse; width: 100%; margin: 4px 0 10px; font-size: 15px; }
.answer th, .answer td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
.answer th { background: var(--strip); font-size: 13px; }
.answer table.stack, .answer table.stack tbody, .answer table.stack tr, .answer table.stack td { display: block; width: 100%; }
.answer table.stack thead { display: none; }
.answer table.stack tr { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; padding: 6px 4px; }
.answer table.stack td { border: 0; padding: 3px 8px; }
.answer table.stack td::before { content: attr(data-h); display: block; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ph { border-radius: 4px; padding: 1px 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; border-bottom: 1.5px dashed #8FA6B9; cursor: pointer; transition: background .12s; }
.ph:hover, .ph:focus-visible { background: #E3EEF6; outline: none; }
.ph.marked { background: var(--mark); border-bottom: 2px solid var(--orange); }
.ph.sel { background: #FFD4B3; }
.locked .ph { cursor: default; border-bottom-color: transparent; }
.locked .ph:hover { background: transparent; }
.ph.r-ok { background: var(--ok); border-bottom: 2px solid var(--green); }
.ph.r-type { background: var(--warn); border-bottom: 2px solid var(--amber); }
.ph.r-miss { background: var(--miss); border-bottom: 2px solid var(--red); }
.ph.r-false { background: #ECEFF3; border-bottom: 2px solid #8A99A8; }
.tag { display: inline-block; font-size: 12px; font-weight: 800; line-height: 1.3; padding: 1px 7px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; background: var(--orange); color: #fff; white-space: nowrap; }
.tag.t-ok { background: var(--green); }
.tag.t-type { background: var(--amber); }
.tag.t-miss { background: var(--red); }
.tag.t-false { background: #8A99A8; }
.mask { display: inline-block; width: 7.5em; height: .95em; background: var(--mask); border-radius: 2px; vertical-align: -2px; }
.mask.labeled { width: auto; height: auto; padding: 0 6px; color: #fff; font-size: 12px; font-weight: 800; line-height: 1.45; vertical-align: 1px; letter-spacing: .03em; }
.actions { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }

/* разбор */
.review { margin-top: 20px; }
.review-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px; }
.review h3 { margin: 0; font-size: 22px; }
.review .sum { color: var(--muted); margin: 0; }
.errs { display: grid; gap: 12px; margin-bottom: 16px; }
.err { border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: 12px; padding: 12px 14px; background: #fff; }
.err.v-ok { border-left-color: var(--green); }
.err.v-type { border-left-color: var(--amber); }
.err.v-miss { border-left-color: var(--red); }
.err.v-false { border-left-color: #8A99A8; background: #FAFBFC; }
.err .eh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 800; }
.chip { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; color: #fff; background: var(--c, var(--blue)); }
.verdict { font-size: 13px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.verdict.v-ok { background: var(--ok); color: #046C4E; }
.verdict.v-type { background: var(--warn); color: #7A5B00; }
.verdict.v-miss { background: var(--miss); color: #9B2C21; }
.err q { display: block; font-style: italic; color: #34495E; margin: 8px 0 6px; quotes: '«' '»'; }
.err .show { margin-top: 4px; padding-left: 0; }
.method { background: var(--strip); border-radius: 12px; padding: 14px 16px; }
.method .label-s { color: var(--teal); }
.method b { display: block; margin-bottom: 4px; }

/* выбор вида */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgba(26, 43, 60, .14); padding: 16px 16px calc(14px + env(safe-area-inset-bottom)); z-index: 40; transform: translateY(105%); transition: transform .18s; border-radius: 18px 18px 0 0; }
.sheet.open { transform: none; }
.sheet-in { max-width: 860px; margin: 0 auto; }
.sheet .q { font-size: 14px; color: var(--muted); margin: 0 0 10px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sheet .types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.sheet .types button { border: 1.5px solid var(--line-strong); border-left: 5px solid var(--c, var(--blue)); background: #fff; color: var(--ink); border-radius: 10px; padding: 10px 12px; font-weight: 800; cursor: pointer; text-align: left; }
.sheet .types button:hover { border-color: var(--c, var(--blue)); background: #F6F9FB; }
.sheet .types button.on { background: var(--c, var(--blue)); border-color: var(--c, var(--blue)); color: #fff; }
.sheet .row2 { display: flex; gap: 10px; justify-content: flex-end; }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 800; cursor: pointer; padding: 6px 4px; text-align: left; }
.linkbtn:hover { text-decoration: underline; }

/* увеличение */
.zoom { position: fixed; inset: 0; background: rgba(9, 24, 38, .94); z-index: 60; overflow: auto; display: none; }
.zoom.open { display: block; }
.zoom-bar { position: sticky; top: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 10px 12px; z-index: 2; }
.zoom-bar button { border: 0; border-radius: 8px; padding: 8px 14px; background: #fff; color: var(--ink); font-weight: 800; cursor: pointer; }
.zoom-in { position: relative; margin: 0 auto 24px; width: 100%; max-width: 1100px; background: #fff; }
.zoom-in img { display: block; width: 100%; height: auto; }

/* итог */
.score-big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 4px 0 6px; }
.score-big b { font-size: clamp(48px, 7vw, 76px); line-height: 1; font-weight: 800; color: #fff; letter-spacing: -.02em; }
.score-big span { font-size: 18px; color: var(--band-muted); }
.final-list { margin-top: 28px; }
.trow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 160px 90px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.trow:last-of-type { border-bottom: 0; }
.trow .tn { width: 30px; height: 30px; border-radius: 50%; background: var(--strip); color: var(--blue); font-weight: 800; display: flex; align-items: center; justify-content: center; }
.trow .tn.done { background: var(--teal); color: #fff; }
.bar { height: 8px; border-radius: 999px; background: var(--strip); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
.trow .res { text-align: right; color: var(--muted); font-size: 14px; white-space: nowrap; }
.missed { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
.missed h3 { margin: 0 0 10px; font-size: 20px; }
.missed ul { padding-left: 20px; margin: 0; }
.missed li { margin-bottom: 10px; }

@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .page-card { position: static; }
  .norm-view { max-height: 60vh; }
  .card { padding: 14px; }
  .answer table, .answer thead, .answer tbody, .answer tr, .answer td { display: block; width: 100%; }
  .answer thead { display: none; }
  .answer tr { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; padding: 6px 4px; }
  .answer td { border: 0; padding: 3px 8px; }
  .answer td::before { content: attr(data-h); display: block; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .steps { grid-template-columns: 1fr; }
  .types-grid { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr; gap: 14px; margin-top: 28px; }
  .hero { padding: 40px 0 34px; }
  .page-label { flex-direction: column; gap: 0; }
  .progress .ptext { display: none; }
  .dots { gap: 3px; }
  .dot { width: 24px; height: 24px; line-height: 20px; font-size: 11px; }
  .trow { grid-template-columns: 30px minmax(0, 1fr) 84px; }
  .trow .bar { display: none; }
}
@media (max-width: 520px) {
  .brand-text { display: none; }
  .top-in { gap: 10px; }
  .progress { margin-left: 0; flex: 1; justify-content: space-between; }
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" id="brand" aria-label="Найди ошибку модели, вводный экран"><span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CCDE9" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 10.5l2 2 3.5-4" stroke="#fff"/></svg></span><span class="brand-text">Найди ошибку модели</span></button>
  <div class="progress" id="progress"></div>
</div></header>
<main id="app"></main>
<div class="sheet" id="sheet" role="dialog" aria-label="Вид ошибки"><div class="sheet-in">
  <p class="label-s">Вид ошибки</p>
  <p class="q" id="sheet-q"></p>
  <div class="types" id="sheet-types"></div>
  <div class="row2"><button class="linkbtn" id="sheet-clear">Снять отметку</button><button class="linkbtn" id="sheet-close">Отмена</button></div>
</div></div>
<div class="zoom" id="zoom" aria-hidden="true"><div class="zoom-bar"><button id="z-plus">Крупнее</button><button id="z-minus">Мельче</button><button id="z-close">Закрыть</button></div><div class="zoom-in" id="zoom-in"></div></div>

к."}, {"key": "t4", "pages": [{"key": "kv04", "img": "img/kv04.jpg", "iw": 1240, "ih": 1755, "label": "Отчет об оценке квартиры, с. 4", "short": "с. 4", "hl": []}, {"key": "kv05", "img": "img/kv05.jpg", "iw": 1240, "ih": 1755, "label": "Отчет об оценке квартиры, с. 5", "short": "с. 5", "hl": []}, {"key": "kv06", "img": "img/kv06.jpg", "iw": 1240, "ih": 1755, "label": "Отчет об оценке квартиры, с. 6", "short": "с. 6", "hl": [[41.86, 10.46, 51.48, 4.56]]}], "norms": [{"key": "fso4", "title": "ФСО IV «Задание на оценку»", "short": "ФСО IV", "paras": ["1. Оценка объекта оценки выполняется оценщиком на основе задания на оценку, которое является неотъемлемой частью договора на оценку объекта оценки (далее – договор на оценку) или представлено в иной письменной форме в случае проведения оценки на основаниях, отличающихся от договора на оценку, предусмотренных Федеральным законом от 29 июля 1998 г. № 135-ФЗ «Об оценочной деятельности в Российской Федерации» (Собрание законодательства Российской Федерации, 1998, № 31, ст. 3813; 2021, № 27, ст. 5179) (далее – Федеральный закон).", "2. Задание на оценку согласовывается заказчиком оценки и оценщиком или юридическим лицом, с которым оценщик заключил трудовой договор, путем подписания в составе договора на оценку или в иной письменной форме в случае проведения оценки на основаниях, отличающихся от договора на оценку.", "Уточнение задания на оценку может продолжаться в течение процесса оценки до составления отчета об оценке.", "3. Задание на оценку должно содержать следующую информацию:", "1) объект оценки, включая права на объект оценки. Идентификация объекта оценки проводится на основе присущих ему количественных и качественных характеристик с учетом описания прав на объект оценки, учитываемых при определении стоимости, и связанных с ними ограничений и обременений. Требования к идентификации объекта оценки по отдельным видам объектов оценки устанавливаются соответствующими специальными федеральными стандартами оценки;", "2) цель оценки, которая должна быть установлена однозначно для определения предпосылок стоимости, в частности цель оценки должна сопровождаться указанием ссылок на конкретные положения нормативных правовых актов Российской Федерации, в связи с которыми возникла необходимость проведения оценки (если применимо);", "3) указание на то, что оценка проводится в соответствии с Федеральным законом;", "4) вид стоимости и предпосылки стоимости, если это необходимо в соответствии с пунктами 17 и 22 федерального стандарта оценки «Виды стоимости (ФСО II)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200;", "5) дата оценки;", "6) специальные допущения, иные существенные допущения в соответствии с разделом II федерального стандарта оценки «Процесс оценки (ФСО III)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200, если они известны на момент составления задания на оценку;", "7) ограничения оценки в соответствии с разделом III федерального стандарта оценки «Процесс оценки (ФСО III)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200, если они известны на момент составления задания на оценку;", "8) ограничения на использование, распространение и публикацию отчета об оценке объекта оценки (далее – отчет об оценке), за исключением случаев, установленных нормативными правовыми актами Российской Федерации;", "9) указание на форму составления отчета об оценке1;", "10) иная информация, предусмотренная федеральными стандартами оценки для отражения в задании на оценку.", "4. Задание на оценку может включать следующую информацию:", "1) состав и объем документов и материалов, представляемых заказчиком оценки;", "2) необходимость привлечения внешних организаций и квалифицированных отраслевых специалистов;", "3) сведения о предполагаемых пользователях результата оценки и отчета об оценке (помимо заказчика оценки);", "4) формы представления итоговой стоимости (например, в виде интервала значений, в валюте, в которой должна быть представлена стоимость в соответствии с пунктом 14 федерального стандарта оценки «Структура федеральных стандартов оценки и основные понятия, используемые в федеральных стандартах оценки (ФСО I)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200);", "5) специфические требования к отчету об оценке (например, в отношении формы и объема раскрытия в отчете информации), не противоречащие федеральному стандарту оценки «Отчет об оценке (ФСО VI)», утвержденному приказом Минэкономразвития России от 14 апреля 2022 г. № 200;", "6) указание на необходимость проведения дополнительных исследований и определения иных расчетных величин, которые не являются результатами оценки в соответствии с федеральными стандартами оценки."], "hl": ["Уточнение задания на оценку может продолжаться в течение процесса оценки до составления отчета об оценке.", "6) специальные допущения, иные существенные допущения в соответствии с разделом II федерального стандарта оценки «Процесс оценки (ФСО III)», утвержденного приказом Минэкономразвития России от 14 апреля 2022 г. № 200, если они известны на момент составления задания на оценку;"]}, {"key": "fso7_30", "title": "ФСО 7 «Оценка недвижимости», пункт 30", "short": "ФСО 7, п. 30", "paras": ["30. После проведения процедуры согласования оценщик, помимо указания в отчете об оценке итогового результата оценки стоимости недвижимости, приводит свое суждение о возможных границах интервала, в котором, по его мнению, может находиться эта стоимость, если в задании на оценку не указано иное."], "hl": []}], "start": "kv06", "context": "Отчет об оценке квартиры, раздел 2 «Задание на оценку» на с. 4—6. Модели подан PDF отчета целиком. Рядом со страницами приведен текст норм.", "request": "Найди нарушения в разделе 2 «Задание на оценку» отчета Отчет.pdf.", "blocks": [{"t": "p", "items": [{"parts": ["Номера пунктов ФСО даны по памяти, тексты стандартов не открывались, перед включением в акт их нужно сверить."]}]}, {"t": "gap"}, {"t": "h", "text": "Допущения и ограничения классифицированы противоречиво (несущественное)."}, {"t": "p", "items": [{"id": "b", "parts": ["В строках «Специальные допущения / иные существенные допущения» и «Ограничения оценки» стоят прочерки (стр. 4), а ниже приведены двенадцать допущений (стр. 5–6)."]}, {"parts": [" "]}, {"parts": ["…"]}, {"parts": [" "]}, {"id": "e1", "parts": ["Допущением 12 за оценщиком сохранено право добавлять допущения в отчете, тогда как ФСО IV п. 7 требует закрепить их в Задании."]}]}, {"t": "gap"}, {"t": "p", "items": [{"id": "c", "parts": ["Отказ от интервала стоимости соответствует строке Задания,"]}, {"parts": [" "]}, {"id": "f", "parts": ["но в п. 4.5 норма ФСО 7 п. 30 пересказана как обязательная, формулировку нужно сверить."]}]}], "phrases": {"b": "В строках «Специальные допущения / иные существенные допущения» и «Ограничения оценки» стоят прочерки (стр. 4), а ниже приведены двенадцать допущений (стр. 5–6).", "e1": "Допущением 12 за оценщиком сохранено право добавлять допущения в отчете, тогда как ФСО IV п. 7 требует закрепить их в Задании.", "c": "Отказ от интервала стоимости соответствует строке Задания,", "f": "но в п. 4.5 норма ФСО 7 п. 30 пересказана как обязательная, формулировку нужно сверить."}, "oks": {"b": "Верно. На с. 4 в этих строках прочерки, допущения 1—12 приведены на с. 5 и 6.", "c": "Верно. В последней строке задания на с. 4 сказано, что стоимость приводится без суждения о границах интервала.", "f": "Верно. В п. 5 раздела 4 на с. 6 норма пересказана без оговорки «если в задании на оценку не указано иное», поэтому сверить формулировку действительно стоит. Отказ от интервала при этом объяснен заданием."}, "errors": [{"ph": "e1", "type": "fake", "ok": ["fake", "num"], "text": "В ФСО IV четыре пункта, пункта 7 в стандарте нет. Согласно подпункту 6 пункта 3 в задании указывают допущения, «если они известны на момент составления задания на оценку», а согласно пункту 2 задание уточняется до составления отчета. Допущение 12 этим требованиям не противоречит, замечание мнимое.", "at": "fso4"}], "method": "Нейтральная постановка вопроса и сверка пункта с текстом стандарта", "methodText": "В запросе «найди нарушения» уже заложено, что нарушения есть, и в ответе появляются замечания к выполненным требованиям. В нейтральном запросе требуется указать, есть ли сведение и на какой странице. Номер пункта нормы проверяющий сверяет с ее текстом до включения замечания в результат проверки."}, {"key": "t5", "pages": [{"key": "kv29", "img": "img/kv29.jpg", "iw": 1240, "ih": 1755, "label": "Отчет об оценке квартиры, с. 29", "short": "с. 29", "hl": [[11.4, 71.45, 81.94, 3.35], [21.75, 82.71, 60.13, 1.78]]}], "norms": [{"key": "fz11", "title": "Закон № 135-ФЗ, статья 11", "short": "Закон, ст. 11", "paras": ["Статья 11. Общие требования к содержанию отчета об оценке объекта оценки", "Итоговым документом, составленным по результатам определения стоимости объекта оценки независимо от вида определенной стоимости, является отчет об оценке объекта оценки (далее также - отчет).", "Отчет составляется на бумажном носителе и (или) в форме электронного документа в соответствии с требованиями федеральных стандартов оценки, нормативных правовых актов уполномоченного федерального органа, осуществляющего функции по нормативно-правовому регулированию оценочной деятельности.", "Отчет не должен допускать неоднозначное толкование или вводить в заблуждение. В отчете в обязательном порядке указываются дата проведения оценки объекта оценки, используемые стандарты оценки, цели и задачи проведения оценки объекта оценки, а также иные сведения, необходимые для полного и недвусмысленного толкования результатов проведения оценки объекта оценки, отраженных в отчете.", "В отчете должны быть указаны: дата составления и порядковый номер отчета; основание для проведения оценщиком оценки объекта оценки; сведения об оценщике или оценщиках, проводивших оценку, в том числе фамилия, имя и (при наличии) отчество, номер контактного телефона, почтовый адрес, адрес электронной почты оценщика и сведения о членстве оценщика в саморегулируемой организации оценщиков; сведения о независимости юридического лица, с которым оценщик заключил трудовой договор, и оценщика в соответствии с требованиями статьи 16 настоящего Федерального закона; цель оценки; точное описание объекта оценки, а в отношении объекта оценки, принадлежащего юридическому лицу, - реквизиты юридического лица и при наличии балансовая стоимость данного объекта оценки; стандарты оценки для определения стоимости объекта оценки, перечень использованных при проведении оценки объекта оценки данных с указанием источников их получения, принятые при проведении оценки объекта оценки допущения; последовательность определения стоимости объекта оценки и ее итоговая величина, ограничения и пределы применения полученного результата; дата определения стоимости объекта оценки; перечень документов, используемых оценщиком и устанавливающих количественные и качественные характеристики объекта оценки.", "Отчет также может содержать иные сведения, являющиеся, по мнению оценщика, существенно важными для полноты отражения примененного им метода расчета стоимости конкретного объекта оценки.", "Для проведения оценки отдельных видов объектов оценки законодательством Российской Федерации могут быть предусмотрены специальные формы отчетов.", "Отчет должен быть пронумерован постранично, прошит (за исключением случаев составления отчета в форме электронного документа), подписан оценщиком или оценщиками, которые провели оценку, а также скреплен личной печатью оценщика или оценщиков либо печатью юридического лица, с которым оценщик или оценщики заключили трудовой договор.", "Отчет, составленный в форме электронного документа, должен быть подписан усиленной квалифицированной электронной подписью в соответствии с законодательством Российской Федерации.", "В случаях, предусмотренных настоящим Федеральным законом, нормативными правовыми актами уполномоченного федерального органа, осуществляющего функции по нормативно-правовому регулированию оценочной деятельности, отчет подлежит опубликованию в порядке, установленном уполномоченным федеральным органом, осуществляющим функции по нормативно-правовому регулированию оценочной деятельности."], "hl": ["Отчет не должен допускать неоднозначное толкование или вводить в заблуждение.", "перечень использованных при проведении оценки объекта оценки данных с указанием источников их получения"]}, {"key": "fz12", "title": "Закон № 135-ФЗ, статья 12 (начало)", "short": "Закон, ст. 12", "paras": ["Статья 12. Достоверность отчета как документа, содержащего сведения доказательственного значения", "Итоговая величина рыночной или иной стоимости объекта оценки, указанная в отчете, составленном по основаниям и в порядке, которые предусмотрены настоящим Федеральным законом, признается достоверной и рекомендуемой для целей совершения сделки с объектом оценки, если в порядке, установленном законодательством Российской Федерации, или в судебном порядке не установлено иное."], "hl": ["содержащего сведения доказательственного значения"]}, {"key": "fz15", "title": "Закон № 135-ФЗ, статья 15 (начало)", "short": "Закон, ст. 15", "paras": ["Статья 15. Обязанности оценщика", "Оценщик обязан: быть членом одной из саморегулируемых организаций оценщиков; соблюдать требования настоящего Федерального закона, федеральных стандартов оценки, иных нормативных правовых актов Российской Федерации в области оценочной деятельности, а также требования стандартов и правил оценочной деятельности, утвержденных саморегулируемой организацией оценщиков, членом которой он является; …"], "hl": ["соблюдать требования настоящего Федерального закона, федеральных стандартов оценки"]}], "start": "kv29", "context": "Отчет об оценке квартиры, обоснование корректировки на торг. Файл отчета модели не подан, сведения из отчета приведены в запросе. Рядом со страницей приведен текст статей закона, ссылки на ФСО оставлены без отметки, тексты этих стандартов в задании не приведены.", "request": "Сформулируй замечание эксперта саморегулируемой организации оценщиков к отчету об оценке рыночной стоимости квартиры в г. Ноябрьске. Факт. На с. 29 отчета в обосновании корректировки на торг написано: «Как следует из анализа рынка, в настоящее время скидки на торг находятся в пределах 1-15%». Ко всем четырем объектам-аналогам применена корректировка на торг −2 %. В разделе 9 «Анализ рынка» на с. 19—25 сведений о скидках на торг нет, источник величины 2 % в отчете не указан. Сошлись на требования законодательства об оценочной деятельности и федеральных стандартов оценки.", "blocks": [{"t": "p", "items": [{"parts": ["В ходе проверки установлено следующее."]}]}, {"t": "ol", "items": [[{"id": "a", "parts": ["Ссылка на анализ рынка не подтверждается материалами отчета."]}, {"parts": [" "]}, {"id": "b", "parts": ["В разделе 9 «Анализ рынка» (с. 19—25) сведения о скидках на торг отсутствуют."]}, {"parts": [" "]}, {"id": "c", "parts": ["Утверждение на с. 29 не опирается на данные, представленные в отчете."]}], [{"id": "d", "parts": ["Источник величины 2 % в отчете не указан."]}], [{"id": "e1", "parts": ["Примененная величина не согласуется с заявленным диапазоном."]}, {"parts": [" "]}, {"id": "f", "parts": ["Значение −2 % расположено у нижней границы диапазона 1–15 %, но оценщик не пояснил, почему выбрано именно оно, а не иное значение внутри диапазона."]}]]}, {"t": "h", "text": "Нарушенные требования"}, {"t": "ul", "items": [[{"id": "g", "parts": ["Статья 11 Федерального закона от 29.07.1998 № 135-ФЗ «Об оценочной деятельности в Российской Федерации»."]}, {"parts": [" "]}, {"id": "e3", "parts": ["Отчет должен содержать сведения доказательственного значения,"]}, {"parts": [" "]}, {"id": "h", "parts": ["не допускать неоднозначного толкования и не вводить в заблуждение, а также содержать перечень использованных данных с указанием источников их получения."]}], [{"id": "e2", "parts": ["Статья 14 того же закона."]}, {"parts": [" "]}, {"id": "i", "parts": ["Оценщик обязан соблюдать требования федеральных стандартов оценки."]}], [{"parts": ["ФСО VI «Отчет об оценке» (утвержден приказом Минэкономразвития России от 14.04.2022 № 200). Информация, существенная для величины стоимости, должна быть подтверждена, а ход рассуждений оценщика должен быть доступен для проверки."]}], [{"parts": ["ФСО V «Подходы и методы оценки». Корректировки, вносимые в рамках сравнительного подхода, должны быть обоснованы."]}], [{"parts": ["ФСО № 7 «Оценка недвижимости» (приказ Минэкономразвития России от 25.09.2014 № 611), п. 11 и п. 22. Анализ рынка должен включать анализ ценообразующих факторов, а корректировки значений единиц сравнения должны основываться на рыночных данных."]}]]}], "phrases": {"a": "Ссылка на анализ рынка не подтверждается материалами отчета.", "b": "В разделе 9 «Анализ рынка» (с. 19—25) сведения о скидках на торг отсутствуют.", "c": "Утверждение на с. 29 не опирается на данные, представленные в отчете.", "d": "Источник величины 2 % в отчете не указан.", "e1": "Примененная величина не согласуется с заявленным диапазоном.", "f": "Значение −2 % расположено у нижней границы диапазона 1–15 %, но оценщик не пояснил, почему выбрано именно оно, а не иное значение внутри диапазона.", "g": "Статья 11 Федерального закона от 29.07.1998 № 135-ФЗ «Об оценочной деятельности в Российской Федерации».", "e3": "Отчет должен содержать сведения доказательственного значения,", "h": "не допускать неоднозначного толкования и не вводить в заблуждение, а также содержать перечень использованных данных с указанием источников их получения.", "e2": "Статья 14 того же закона.", "i": "Оценщик обязан соблюдать требования федеральных стандартов оценки."}, "oks": {"a": "Верно, по сведениям запроса в разделе 9 данных о скидках на торг нет.", "b": "Верно, это сказано в запросе.", "c": "Верно, это следует из сведений запроса.", "d": "Верно, это сказано в запросе.", "f": "Верно. Значение −2 % на с. 29 входит в интервал 1—15 % и близко к его нижней границе, выбор значения в отчете не объяснен.", "g": "Верно, статья 11 закона устанавливает требования к содержанию отчета.", "h": "Верно, оба требования есть в статье 11.", "i": "Верно по содержанию, эта обязанность записана в статье 15."}, "errors": [{"ph": "e1", "type": "fake", "ok": ["fake"], "text": "Значение −2 % входит в интервал 1—15 %, об этом сказано и в следующей фразе ответа. Противоречия с интервалом нет. Предметом замечания остается обоснованность величины, источник которой в отчете не указан.", "at": "kv29"}, {"ph": "e2", "type": "num", "ok": ["num", "fake"], "text": "Обязанность оценщика соблюдать федеральные стандарты оценки установлена статьей 15 Федерального закона № 135-ФЗ. Статья 14 устанавливает права оценщика.", "at": "fz15"}, {"ph": "e3", "type": "num", "ok": ["num", "fake"], "text": "В статье 11 слов о сведениях доказательственного значения нет, они стоят в названии статьи 12 «Достоверность отчета как документа, содержащего сведения доказательственного значения». Ссылка дана не на ту статью. Требования о недопустимости неоднозначного толкования и о перечне использованных данных с указанием источников в статье 11 есть.", "at": "fz12"}], "method": "Сверка доводов с числами страницы и ссылок с текстом нормы", "methodText": "Проверяющий сопоставляет каждый довод замечания с числами на странице отчета, а статьи закона и пункты стандартов сверяет с их текстом. Ссылку, которой нет в тексте нормы, в замечание не включают."}, {"key": "t6", "pages": [{"key": "zu05", "img": "img/zu05.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 5", "short": "с. 5", "hl": [[44.46, 91.39, 16.53, 2.02]]}, {"key": "zu09", "img": "img/zu09.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 9", "short": "с. 9", "hl": []}, {"key": "zu19", "img": "img/zu19.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 19", "short": "с. 19", "hl": [[27.01, 18.25, 17.63, 2.16]]}, {"key": "zu122", "img": "img/zu122.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 122", "short": "с. 122", "hl": [[13.1, 75.07, 72.73, 5.23]]}], "norms": [], "start": "zu122", "context": "Отчет об оценке земельных участков. Ответ получен при повторной проверке строки свода нарушений по самому отчету и его приложениям, полный текст запроса не сохранился, приведено его начало. Страница 122 входит в ту же выписку по участку объекта 3, что и страница 126. Одинаковые кадастровые номера закрыты одинаковыми метками.", "request": "Ты видишь этот свод впервые. Проверь каждую строку свода…", "blocks": [{"t": "p", "items": [{"parts": ["Выписки по участкам объектов 2 (с. 111) и 3 (с. 126) и договор купли-продажи участка объекта 3 (с. 117) содержат ограничения прав по ст. 56 Земельного кодекса,"]}, {"parts": [" "]}, {"id": "e1", "parts": ["что расходится с текстом «ограничения и обременения права не зарегистрированы» (с. 19) и «Не зарегистрировано.» (с. 5)."]}]}, {"t": "gap"}, {"t": "p", "items": [{"id": "b", "parts": ["Расчет без учета ограничений предусмотрен заданием (с. 9)"]}, {"parts": [" …"]}]}], "phrases": {"e1": "что расходится с текстом «ограничения и обременения права не зарегистрированы» (с. 19) и «Не зарегистрировано.» (с. 5).", "b": "Расчет без учета ограничений предусмотрен заданием (с. 9)"}, "oks": {"b": "Верно. На с. 9 права, учитываемые при оценке, указаны «без учета ограничений и обременений»."}, "errors": [{"ph": "e1", "type": "skip", "ok": ["skip"], "text": "В выписке ограничения, предусмотренные статьями 56 и 56.1 Земельного кодекса, записаны в особых отметках как сведения об ограничениях, «не зарегистрированных в реестре прав». Фраза отчета о том, что ограничения и обременения не зарегистрированы, с выпиской согласуется. Раздел особых отметок в ответе не учтен, противоречия нет.", "at": "zu122"}], "method": "Просмотр документа целиком и повторная проверка без истории", "methodText": "Проверяющий сверяет цитату из выписки со всеми ее разделами, включая особые отметки. Спорную строку свода перепроверяют в отдельном диалоге без истории и без предыдущих выводов, а при расхождении двух проверок обращаются к самому документу."}, {"key": "t7", "pages": [{"key": "zu07", "img": "img/zu07.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 7", "short": "с. 7", "hl": [[25.56, 31.29, 48.96, 3.39]]}, {"key": "zu91", "img": "img/zu91.jpg", "iw": 1241, "ih": 1754, "label": "Отчет об оценке земельных участков, с. 91", "short": "с. 91", "hl": [[17.06, 34.58, 57.45, 3.39], [75.81, 33.22, 16.17, 2.02]]}], "norms": [], "start": "zu91", "context": "Отчет об оценке земельных участков и права пользования зданием. Ответ получен при составлении свода нарушений по отчету. Задание модели дано одной фразой «Собери свод выявленных нарушений по файлу Правила_свода.md», в запросе ниже приведено содержание этого файла. Одинаковые кадастровые номера закрыты одинаковыми метками, у участка объекта 3 метка КН_3.", "request": "Свод выявленных нарушений\n\nЗадача. Собери свод выявленных нарушений по файлам результатов навыков в папке Результаты, Проверка_методологии.md (строки М), Типовые_нарушения.md (строки Т), Непротиворечивость_факторов.md (строки Ф), Расхождения_расчетов.md (строки Р по порядку расхождений). Каждую строку с выводом «нарушение», «не учтен», «учтен несопоставимо» или с расхождением расчета перенеси в свод. Строки с выводом «соответствует» сопоставь со строками других навыков о том же факте.\n\nПоля свода. Номер строки. Норма, пункт закона об оценочной деятельности или ФСО по тексту из Результаты/Нормы_md. Установленный факт с дословной цитатой. Место в отчете, страницы по маркеру [СТРАНИЦА N]. Вид нарушения, одно значение из четырех, недостоверность исходных данных, внутреннее противоречие, арифметическая ошибка, неполнота сведений. Этап анализа, одно значение из шести, задание и допущения, описание объекта и документы, анализ рынка, наиболее эффективное использование, расчет по подходу, согласование и итог. Источник находки, коды строк навыков. Связь с первичным нарушением, номер первичной строки свода либо отметка «первичное». Статус и причина. Влияние на итоговую величину, графа остается пустой.\n\nПравила ведения.\n1. Вид нарушения устанавливается по факту, а не по навыку, которым факт выявлен.\n2. Факт, установленный двумя навыками, записывается одной строкой, в графе источника приводятся коды обоих навыков. Разные факты об одном факторе записываются разными строками.\n3. Если навыки оценили один факт по-разному, у одного «соответствует», у другого нарушение, строка записывается с кодами обоих навыков и статусом «не подтверждено, навыки разошлись» до ручной проверки по изображению страницы.\n4. Последствия первичного нарушения на следующих этапах (наиболее эффективное использование, расчеты, итог) записываются в строку первичного нарушения с цитатами и страницами, отдельных строк для них нет. Находка, которая следует из уже записанного нарушения, отдельной строкой не записывается, ее код добавляется в источник первичной строки.\n5. Статус «подтверждено» ставится только после сверки цитаты с текстом отчета скриптом, цитаты со страниц-сканов сверяются по изображению страницы.\n6. Норма в строке сверяется с текстом пункта в Нормы_md, пункт, который к факту не относится, исправляется.\n\nФормат выхода. Таблица свода в файле Результаты/Свод_нарушений_в1.md, под таблицей перечень объединенных строк (какие коды сведены в одну строку) и перечень строк со статусом «не подтверждено» с причиной.", "blocks": [{"t": "p", "items": [{"parts": ["Объект 4 определен «с учетом относимого земельного участка с кадастровым номером ", {"m": "КН_3"}, "» (с. 1, 5, 8),"]}, {"parts": [" "]}, {"id": "b", "parts": ["этот же участок оценен отдельно как объект 3, «62 319 000 руб.» (с. 7, 91)."]}, {"parts": [" …"]}]}, {"t": "p", "items": [{"id": "e1", "parts": ["Входит ли плата за участок в результат по объекту 4 «1 345 878 руб./месяц» (с. 91), в отчете не сказано,"]}, {"parts": [" …"]}]}, {"t": "p"   function pageView(p, showHl, forZoom) {
    var w = el('div', forZoom ? '' : 'page-wrap');
    var img = el('img');
    img.src = p.img; img.width = p.iw; img.height = p.ih;
    img.alt = p.label;

    if (showHl) p.hl.forEach(function (r) {
      var h = el('div', 'hl');
      h.style.left = r[0] + '%'; h.style.top = r[1] + '%'; h.style.width = r[2] + '%'; h.style.height = r[3] + '%';
      w.appendChild(h);
    });
    return w;
  }

  function normView(n, showHl) {
    var v = el('div', 'norm-view');
    n.paras.forEach(function (text) {
      var p = el('p'), pos = 0;
      var hits = [];
      if (showHl) n.hl.forEach(function (h) { var i = text.indexOf(h); if (i >= 0) hits.push([i, i + h.length]); });
      hits.sort(function (a, b) { return a[0] - b[0]; });
      hits.forEach(function (hh) {
        if (hh[0] < pos) return;
        p.appendChild(document.createTextNode(text.slice(pos, hh[0])));
        p.appendChild(el('mark', null, text.slice(hh[0], hh[1])));
        pos = hh[1];
      });
      p.appendChild(document.createTextNode(text.slice(pos)));
      v.appendChild(p);
    });
    return v;
  }

  function renderPagePanel(pc, t, checked) {

        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', it.key === cur ? 'true' : 'false');
        b.onclick = function () { tabSel[t.key] = it.key; renderPagePanel(pc, t, checked); };
        tabs.appendChild(b);
      });
      pc.appendChild(tabs);

  function renderItems(parent, items, t, locked) {

    items.forEach(function (it) {
      if (!it.id) { renderParts(parent, it.parts); return; }
      var s = el('span', 'ph');
      s.dataset.id = it.id;
      renderParts(s, it.parts);
      var mk = marks[it.id], e = errById[it.id];

        s.tabIndex = 0;

        if (sel === it.id) s.classList.add('sel');
        s.onclick = function () { openSheet(t, it.id); };
        s.onkeydown = function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openSheet(t, it.id); } };
      } else {
        var n = e ? t.errors.indexOf(e) + 1 : 0;

        else if (e && mk) { s.classList.add('r-type'); s.appendChild(el('span', 'tag t-type', 'Ошибка ' + n + ', вид другой')); }

  function renderAnswer(t, locked) {

  // увеличение страницы
  var zoom = document.getElementById('zoom'), zin = document.getElementById('zoom-in'), zscale = 1;
  function openZoom(p, hl) {
    zin.innerHTML = ''; zin.appendChild(pageView(p, hl, true));
    zscale = 1; applyZoom();
    zoom.classList.add('open'); zoom.setAttribute('aria-hidden', 'false'); zoom.scrollTop = 0;
  }
  function applyZoom() {
    var base = window.innerWidth <= 860 ? 2.2 : 1;
    var big = base * zscale > 1;
    zin.style.width = big ? (base * zscale * 100) + '%' : '';
    zin.style.maxWidth = big ? 'none' : '';
  }
  document.getElementById('z-plus').onclick = function () { zscale = Math.min(zscale + 0.75, 3.25); applyZoom(); };
  document.getElementById('z-minus').onclick = function () { zscale = Math.max(zscale - 0.75, 1); applyZoom(); };
  document.getElementById('z-close').onclick = function () { zoom.classList.remove('open'); zoom.setAttribute('aria-hidden', 'true'); };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (zoom.classList.contains('open')) document.getElementById('z-close').onclick();
    else if (sheet.classList.contains('open')) { closeSheet(); render(); }
  });

  render();
})();
</script>
</body>
</html>
